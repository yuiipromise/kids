let audioCtx=null;
function audio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function beep(type){
  const a=audio(),now=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);
  const cfg={
    discard:[180,.045,"square"],draw:[520,.08,"sine"],place:[260,.07,"triangle"],
    recipe:[760,.12,"sine"],error:[130,.09,"square"],turn:[420,.04,"sine"],win:[660,.12,"sine"]
  }[type]||[300,.05,"sine"];
  o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);
  if(type==="draw")o.frequency.exponentialRampToValueAtTime(800,now+cfg[1]);
  if(type==="recipe")o.frequency.setValueAtTime(980,now+.07);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.11,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+cfg[1]);
  o.start(now);o.stop(now+cfg[1]+.02);
  if(type==="win")setTimeout(()=>{beep("recipe")},120);
}
function rectCenter(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}}
function flyCard(label,fromEl,toEl,done){
  if(!fromEl||!toEl){done?.();return}
  const a=rectCenter(fromEl),b=rectCenter(toEl);
  const ghost=document.createElement("div");ghost.className="motionCard";ghost.textContent=label;
  ghost.style.width=Math.max(52,Math.min(72,a.w||64))+"px";ghost.style.height=Math.max(64,Math.min(88,a.h||80))+"px";
  ghost.style.left=(a.x-32)+"px";ghost.style.top=(a.y-38)+"px";
  document.body.appendChild(ghost);
  requestAnimationFrame(()=>{ghost.style.transform="translate("+(b.x-a.x)+"px,"+(b.y-a.y)+"px) scale(.92)";ghost.style.opacity=".78"});
  setTimeout(()=>{ghost.remove();done?.()},340);
}

function roundRotateArray(a,steps){
  const n=((steps%a.length)+a.length)%a.length;
  return a.map((_,i)=>a[(i-n+a.length)%a.length]);
}
function roundTick(t){
  if(!rouletteRunning)return;
  if(!roundLastTime)roundLastTime=t;
  const dt=Math.min((t-roundLastTime)/1000,.04);
  roundLastTime=t;
  roundAngle+=430*dt;
  $("roundDial").style.transform="rotate("+roundAngle+"deg)";
  roundRAF=requestAnimationFrame(roundTick);
}
function spinRoundRoulette(){
  const btn=$("rouletteBtn");
  if(roundStopping||btn.classList.contains("doneBtn"))return;
  if(!rouletteRunning){
    roundLabelsData=shuffle(["1ばん","2ばん","3ばん","おやすみ"]);
    document.querySelectorAll(".roundLabel").forEach((el,i)=>el.textContent=roundLabelsData[i]);
    $("roundRouletteStage").classList.remove("done");
    $("roundRouletteStage").classList.add("spinning");
    rouletteRunning=true;roundLastTime=0;
    btn.textContent="とめる！";
    roundRAF=requestAnimationFrame(roundTick);
    return;
  }

  rouletteRunning=false;roundStopping=true;cancelAnimationFrame(roundRAF);
  const spinSpeed=430,desiredDecel=190;
  const naturalDistance=(spinSpeed*spinSpeed)/(2*desiredDecel);
  let target=Math.round((roundAngle+naturalDistance)/90)*90;
  if(target<=roundAngle+180)target+=90;
  while(true){
    const step=((Math.round(target/90)%4)+4)%4;
    if(roundRotateArray(roundLabelsData,step)[2]!=="おやすみ")break;
    target+=90;
  }
  const startAngle=roundAngle,distance=target-startAngle;
  const decel=(spinSpeed*spinSpeed)/(2*distance),duration=spinSpeed/decel,startTime=performance.now();
  btn.disabled=true;btn.textContent="とまるよ…";

  function coast(now){
    const t=Math.min((now-startTime)/1000,duration);
    roundAngle=startAngle+spinSpeed*t-.5*decel*t*t;
    $("roundDial").style.transform="rotate("+roundAngle+"deg)";
    if(t<duration){roundRAF=requestAnimationFrame(coast);return}
    roundAngle=target;$("roundDial").style.transform="rotate("+roundAngle+"deg)";
    const step=((Math.round(roundAngle/90)%4)+4)%4;
    const finalBySector=roundRotateArray(roundLabelsData,step);
    const sectorNames=["おねえさん","シェフ","あなた","ねこさん"];
    roundAssignments={};
    finalBySector.forEach((v,i)=>roundAssignments[sectorNames[i]]=v);

    const stage=$("roundRouletteStage"),wheel=$("roundColorWheel");
    const chars=[document.querySelector(".roundSister"),document.querySelector(".roundChef"),document.querySelector(".roundYou"),document.querySelector(".roundCat")];
    const results=[document.querySelector(".roundSister .roundResult"),document.querySelector(".roundChef .roundResult"),document.querySelector(".roundYou .roundResult"),document.querySelector(".roundCat .roundResult")];
    finalBySector.forEach((v,i)=>{
      results[i].textContent=v==="おやすみ"?"":v[0];
      results[i].style.display=v==="おやすみ"?"none":"flex";
    });
    const restIndex=finalBySector.indexOf("おやすみ");
    if(restIndex>=0){wheel.classList.add("rest-"+restIndex);chars[restIndex].classList.add("resting")}
    stage.classList.remove("spinning");stage.classList.add("done");
    btn.textContent="きまり！";btn.classList.add("doneBtn");btn.disabled=true;roundStopping=false;

    const activeComs=COMS.filter(c=>roundAssignments[c.name]!=="おやすみ");
    players=[USER,...activeComs].map((p,idx)=>({...p,id:idx,recipe:null,hand:[],placed:[]}));
    const firstName=Object.keys(roundAssignments).find(name=>roundAssignments[name]==="1ばん");
    turn=Math.max(0,players.findIndex(p=>p.name===firstName));
    setTimeout(()=>{
      show("game");
      beginSetupSequence();
    },850);
  }
  roundRAF=requestAnimationFrame(coast);
}

function buildDeck(){
  clearRecipeHint();
  recipePenaltyArmed=false;
  recipeSkipActive=false;
  // 今回の3人のレシピに合わせて山札の出現率を調整する。
  // アイスは現行レシピで未使用なので山札から外す。
  // 各食材は基本2枚＋その食材を必要とするレシピ人数ぶん追加。
  // 例: 誰も使わない=2枚、1人が使う=3枚、2人=4枚、3人=5枚。
  let a=[];
  Object.keys(ITEMS).forEach(k=>{
    if(k==="icecream")return;
    const demand=players.reduce((n,p)=>n+(p.recipe&&p.recipe.need.includes(k)?1:0),0);
    const copies=2+demand;
    for(let i=0;i<copies;i++)a.push(k);
  });
  deck=shuffle(a);discard=[];gameOver=false;
  players.forEach(p=>{
    p.hand=[];p.placed=[];
    for(let i=0;i<6;i++)p.hand.push(deck.pop());
  });
  initialDeckCount=Math.max(1,deck.length);
}

  phase="recipeReveal";

}

function confirmSetupSelection(){
  if(phase!=="setupSelect")return;
  clearTimeout(setupNoticeTimer);
  setupNotice="";
  setupToast="";
  const needed=setupUsableKeys();
  const chosenKeys=[...setupSelected].map(i=>players[0].hand[i]);

  if(needed.length===0&&chosenKeys.length===0){
    finishInitialSelection(true);
    return;
  }

  const missing=needed.some(k=>!chosenKeys.includes(k));
  const extra=chosenKeys.some(k=>!needed.includes(k));
  if(missing&&extra){
    beep("error");
    setStatus("うーん……もういちど みてみよう！");
    return;
  }
  if(extra){
    beep("error");
    setStatus("あれれ？つかわないざいりょうを えらんでるよ。");
    return;
  }
  if(missing||chosenKeys.length!==needed.length){
    beep("error");
    setStatus("まだあるよ！");
    return;
  }

  finishInitialSelection(false);
}

function finishInitialSelection(none=false){
  if(phase!=="setupSelect")return;

  const user=players[0];
  const chosen=none?[]:[...setupSelected].sort((a,b)=>b-a);
  const movedUser=[];

  chosen.forEach(i=>{
    const card=user.hand[i];
    if(card&&canUse(user,card)){
      user.hand.splice(i,1);
      user.placed.push({card,public:false});
      movedUser.push(card);
    }
  });

  players.slice(1).forEach(p=>{
    for(let i=p.hand.length-1;i>=0;i--){
      const card=p.hand[i];
      if(canUse(p,card)){
        p.hand.splice(i,1);
        p.placed.push({card,public:false});
      }
    }
  });

  setupSelected.clear();
  phase="setupPlacing";
  render();
  beep("place");

  const ordered=movedUser.slice().reverse();
  let feedback=null;
  if(none){
    feedback=showSetupFeedback([],true);
  }else{
    showSetupPlacedCutin(ordered);
  }
  setStatus(none?"つかえる しょくざいは なかったよ。":"カウンターに おいたよ！");

  setTimeout(()=>{
    if(feedback)feedback.remove();
    if(gameOver)return;
    setStatus("りょうり スタート！");
    startTurn();
  },1850);
}

function spinRoulette(){
  const btn=$("rouletteBtn");
  if(!rouletteRunning){
    rouletteRunning=true;rouletteStartedAt=Date.now();btn.textContent="ストップ！";
    rouletteTimer=setInterval(()=>{
      rouletteCurrent=(rouletteCurrent+1)%players.length;
      const p=players[rouletteCurrent];
      $("roulette").innerHTML=charHTML(p,"rouletteChar","relaxed",true);
      $("rouletteName").textContent=p.name;
    },95);
    return;
  }

  // 子どものダブルタップで開始直後に止まらないよう、短い連打だけ無視する。
  if(Date.now()-rouletteStartedAt<350)return;

  rouletteRunning=false;
  if(rouletteTimer){clearInterval(rouletteTimer);rouletteTimer=null}
  btn.disabled=true;btn.textContent="ストップ！";
  turn=rouletteCurrent;
  const p=players[turn];
  $("roulette").innerHTML=charHTML(p,"rouletteChar","relaxed",true);
  $("rouletteName").textContent=p.name+" から スタート！";
  setTimeout(()=>{
    show("game");
    beginSetupSequence();
  },650)
}
function startTurn(){
  if(gameOver)return;
  turnEpoch++;
  const epoch=turnEpoch,currentTurn=turn;
  document.querySelectorAll(".motionCard").forEach(x=>x.remove());
  selectedIndex=null;phase="discard";const p=players[turn];beep("turn");
  setStatus(p.human?"てふだから 1まい すててね。":p.name+" の ばん！");render();
  if(!p.human)setTimeout(()=>comDiscard(currentTurn,epoch),cpuThinkDelay(p,1300,900))
}

function clearRecipeHint(){
  clearTimeout(recipeHintTimer);
  recipeHintTimer=null;
  recipeHintReady=false;
}
function scheduleRecipeHint(from,card,claimId){
  clearRecipeHint();
  if(from===0||!canUse(players[0],card))return;
  recipeHintTimer=setTimeout(()=>{
    if(gameOver||!pending||pending.id!==claimId||pending.from!==from||pending.card!==card)return;
    if(!canUse(players[0],card))return;
    recipeHintReady=true;
    render();
  },1400);
}

}
function recipeOops(){

function deckStackHTML(){

function counterHTML(p,isMe){
  const prePlacement=phase==="setupSelect"||phase==="menuSelect"||phase==="recipeReveal"||phase==="handReveal";
  if(!p.recipe){
    return '<div class="counter '+(isMe?'selfCounter':'cpuCounter')+'">'+Array.from({length:6},()=>'<div class="slot empty"></div>').join("")+'</div>';
  }
  return '<div class="counter '+(isMe?'selfCounter':'cpuCounter')+'" '+(isMe&&!prePlacement?'onclick="humanCounterTap()"':'')+'>'+p.recipe.need.map(k=>{
    const x=p.placed.find(q=>q.card===k);

    if(prePlacement)return '<div class="slot empty"></div>';

    if(!x){
      if(isMe)return '<div class="slot waiting" data-key="'+k+'"><img class="counterIcon" src="'+foodCardPath(k)+'" alt="'+ITEMS[k]+'"></div>';
      return '<div class="slot cpuUnknown"></div>';
    }

    const open=x.public||(isMe&&counterPeek.has(k));
    if(open){
      if(!isMe)return '<div class="slot cpuTaken"><img class="cpuMiniOpen" src="'+foodIconPath(k)+'" alt="'+ITEMS[k]+'"></div>';
      return '<div class="slot occupiedCard '+(x.public?"public ":"")+(counterPeek.has(k)?"peek ":"")+'" data-key="'+k+'" onclick="counterSlotTap(event,\''+k+'\')"><div class="cardface"><img src="'+foodCardPath(k)+'" alt="'+ITEMS[k]+'"></div></div>';
    }

    if(!isMe)return '<div class="slot cpuTaken"><img class="cpuMiniBack" src="'+CPU_CARD_BACK+'" alt="ふせたカード"></div>';

    return '<div class="slot hiddenCard occupiedCard" data-key="'+k+'" onclick="counterSlotTap(event,\''+k+'\')"><img class="counterBack" src="'+CARD_BACK+'" alt="ふせたカード"></div>';
  }).join("")+'</div>'
}

function counterSlotTap(event,k){
  event.stopPropagation();
  if(phase==="setupPreview"||gameOver)return;
  const p=players[0],x=p.placed.find(q=>q.card===k);
  if(!x)return;
  if(x.public)return;
  counterPeek.add(k);
  clearTimeout(counterPeekTimers[k]);
  render();
  counterPeekTimers[k]=setTimeout(()=>{
    counterPeek.delete(k);
    delete counterPeekTimers[k];
    if($("game").classList.contains("active"))render();
  },2400);
}

function setupHandTap(i){
  if(phase!=="setupSelect"||gameOver)return;
  const p=players[0],card=p.hand[i];
  if(!card)return;

  if(setupSelected.has(i)){
    setupSelected.delete(i);
    setupToast="";
    setStatus("つかえるしょくざいがあったら、えらんでOKをおそう！");
    render();
    return;
  }

  // 準備中は、使わない材料も一度は選べる。
  // OK時にまとめて「あれれ？」と気づかせる。
  // 同じ食材は1枚だけ。2枚目を押した時だけ、短く案内する。
  const sameAlready=[...setupSelected].some(idx=>p.hand[idx]===card);
  if(sameAlready){
    beep("error");
    flashSetupNotice("つかえるのは1まいだよ！");
    return;
  }

  setupSelected.add(i);
  setupToast="";
  setStatus("つかえるしょくざいがあったら、えらんでOKをおそう！");
  render();
}

function setStatus(t){$("status").textContent=t}
function canUse(p,k){return p.recipe.need.includes(k)&&!p.placed.some(x=>x.card===k)}
function humanCardTap(i){

    const card=players[0].hand[i];

  }else if(turn===0&&phase==="discard"){
    setStatus("てふだから 1まい えらんでね。");
  }
  render()
}
function humanCounterTap(){
  if(phase==="setupPreview")return;
  if(turn!==0||phase!=="discard"||gameOver){beep("error");return}
  const p=players[0];
  if(selectedIndex===null||!p.hand[selectedIndex]){beep("error");setStatus("まず てふだを 1まいえらんでね。");return}
  if(!canUse(p,p.hand[selectedIndex])){beep("error");setStatus("そのカードは カウンターに出せないよ。");return}
  const i=selectedIndex;selectedIndex=null;placeFromHand(i)
}
function humanDiscardSelected(){
  if(turn!==0||phase!=="discard"||gameOver){beep("error");return}
  const p=players[0];
  if(selectedIndex===null||!p.hand[selectedIndex]){beep("error");setStatus("まず すてるカードを 1まいえらんでね。");return}
  const i=selectedIndex;selectedIndex=null;discardFrom(0,i)
}
function placeFromHand(i){
  const epoch=turnEpoch;
  const p=players[0],card=p.hand[i];selectedIndex=null;
  if(!canUse(p,card))return;
  const from=document.querySelector('#myHand .handCard[data-i="'+i+'"]');
  const to=document.querySelector('#seat0 .slot[data-key="'+card+'"]');
  phase="animating";setStatus(ITEMS[card]+" を キッチンカウンターに おくよ。");
  flyCard(ITEMS[card],from,to,()=>{
    p.hand.splice(i,1);p.placed.push({card,public:false});beep("place");render();
    flashEl(document.querySelector('#seat0 .slot[data-key="'+card+'"]'),"placeFlash");
    showCutin({actor:p,cards:[card],title:"やったね！",subtitle:ITEMS[card]+" を おいたよ！",duration:2000});
    if(checkWin(0,2200))return;
    setTimeout(()=>{
      if(gameOver||turn!==0||turnEpoch!==epoch||phase!=="animating")return;
      phase="discard";setStatus("つぎに てふだから 1まい すててね。");render();
    },2050);
  })
}

function discardFrom(pid,i){
  if(pid===0)selectedIndex=null;

  // 前の人の捨て札への「レシピ！」は、この人が次の捨て札を選ぶ瞬間まで有効。
  // 新しい捨て札を出し始めた時点で、ひとつ前の権利だけを締め切る。
  pending=null;
  clearRecipeHint();
  recipeSkipActive=false;

  const p=players[pid],card=p.hand[i];
  const from=pid===0?document.querySelector('#myHand .handCard[data-i="'+i+'"]'):$("seat"+pid);
  const to=$("discardPile");
  phase="animating";setStatus(p.name+" が カードを すてます。");
  flyCard(ITEMS[card],from,to,()=>{
    p.hand.splice(i,1);discard.push(card);pending={from:pid,card,id:++claimSeq};const claimId=pending.id;beep("discard");
    if(pid!==0&&recipePenaltyArmed){
      recipePenaltyArmed=false;
      recipeSkipActive=true;
    }
    if(pid===0){
      phase="draw";
      setStatus(ITEMS[card]+" を すてた。すぐに やまふだから ひけるよ！");
    }else{
      phase="claim";
      setStatus(p.name+" が "+ITEMS[card]+" を すてた！");
    }
    render();flashEl($("discardPile"));
    if(!recipeSkipActive)scheduleRecipeHint(pid,card,claimId);
    setTimeout(()=>resolveClaims(pid,card,claimId),520)
  })
}

function resolveClaims(from,card,claimId){
  if(gameOver)return;
  const claimEpoch=turnEpoch;
  if(waitForCutin(()=>resolveClaims(from,card,claimId)))return;
  const order=[];for(let s=1;s<players.length;s++)order.push((from+s)%players.length);

  // 自分が捨てた直後は、山札操作を止めない。
  if(from!==0&&turn===from&&phase==="claim")render();

  const humanCanClaim=from!==0&&canUse(players[0],card);
  if(humanCanClaim)setStatus("「レシピ！」できるか すてふだを みてね。");

  // CPUも即決しない。少し考えてから判断する。
  // 人間のレシピ！は時間では締め切らない。次の人が自分の捨て札を選ぶまで pending を残す。
  setTimeout(()=>{
    if(gameOver||!pending||pending.id!==claimId||pending.from!==from||pending.card!==card)return;
    for(const id of order){
      if(id===0)continue;
      const p=players[id];
      if(canUse(p,card)&&Math.random()<p.skill){takeDiscard(id,card,from,claimId);return}
    }
    // COMの通常処理だけここから山札へ進める。人間はすでに引ける状態。
    if(from!==0&&turn===from&&turnEpoch===claimEpoch&&phase==="claim")finishClaimWindow(from,claimEpoch)
  },950+rand(650))
}

function humanRecipe(){
  if(gameOver)return;
  if(recipeSkipActive){
    beep("error");
    setStatus("いまは おやすみ！");
    return;
  }

  const valid=!!(pending&&pending.from!==0&&canUse(players[0],pending.card));
  if(!valid){
    recipeOops();
    return;
  }

  const card=pending.card,from=pending.from,claimId=pending.id;
  clearRecipeHint();
  takeDiscard(0,card,from,claimId)
}

function takeDiscard(pid,card,from,claimId){
  // 最初に「いただき！」を成立させた1人だけが取れる。
  if(!pending||pending.id!==claimId||pending.from!==from||pending.card!==card)return false;

  const fromEl=$("discardPile"),toEl=$("seat"+pid);
  const claimEpoch=turnEpoch;
  const claimWasBlockingTurn=(turn===from&&phase==="claim");
  const sadLoser=players.find((p,i)=>i!==pid&&i!==from&&canUse(p,card))||null;

  // アニメーション開始時点でロックする。
  pending=null;
  clearRecipeHint();
  setStatus("「いただき！」 "+players[pid].name+"！");
  render();
  beep("recipe");

  flyCard(ITEMS[card],fromEl,toEl,()=>{
    if(discard.at(-1)===card)discard.pop();
    players[pid].placed.push({card,public:true});

    setStatus("「いただき！」 "+players[pid].name+" が "+ITEMS[card]+" を とった！");
    render();flashEl($("seat"+pid),"placeFlash");
    showCutin({
      actor:players[pid],
      cards:[card],
      title:"いただき！",
      subtitle:players[pid].name+" が "+ITEMS[card]+" を ゲット！",
      surprised:players[from],
      sad:sadLoser,
      duration:2500
    });
    if(checkWin(pid,2700))return;

    if(claimWasBlockingTurn){
      setTimeout(()=>{
        if(gameOver)return;
        if(turn===from&&turnEpoch===claimEpoch&&phase==="claim")finishClaimWindow(from,claimEpoch);
      },2550);
    }
  });
  return true;
}

function finishClaimWindow(from,expectedEpoch=turnEpoch){
  if(gameOver||turn!==from||turnEpoch!==expectedEpoch||phase!=="claim")return;
  turn=from;phase="draw";const p=players[turn];
  setStatus(p.human?"やまふだから 1まい ひいてね。":p.name+" が やまふだから ひきます。");render();
  if(!p.human){const epoch=turnEpoch,currentTurn=turn;setTimeout(()=>drawFor(currentTurn,epoch),cpuThinkDelay(p,900,650))}
}

function humanDraw(){if(turn===0&&phase==="draw")drawFor(0,turnEpoch)}
function drawFor(pid,epoch=turnEpoch){
  if(waitForCutin(()=>drawFor(pid,epoch)))return;
  if(gameOver||turn!==pid||turnEpoch!==epoch)return;
  if(deck.length===0)refillDeck();if(deck.length===0)return;
  const p=players[pid],card=deck[deck.length-1],fromEl=$("deckBtn"),toEl=$("seat"+pid);
  phase="animating";setStatus(p.name+" が やまふだから ひきます。");beep("draw");
  flyCard(pid===0?ITEMS[card]:"カード",fromEl,toEl,()=>{
    deck.pop();
    const placed=canUse(p,card);
    if(placed){
      p.placed.push({card,public:false});beep("place");
      setStatus(p.name+" は ひいたカードを キッチンカウンターに おいた。");
    }else{
      p.hand.push(card);setStatus(p.human?ITEMS[card]+" を ひいた。":p.name+" は カードを ひいた。")
    }
    render();flashEl($("seat"+pid),"placeFlash");
    if(placed)showCutin({actor:p,cards:[card],hidden:!p.human,title:"カウンターに おいたよ！",subtitle:p.human?ITEMS[card]+" を おいたよ！":p.name+" が 1まい おいたよ！",duration:1800});
    if(checkWin(pid,placed?2000:300))return;
    setTimeout(()=>nextTurn(pid,epoch),placed?1950:900+rand(650))
  })
}

function comDiscard(expectedTurn=turn,epoch=turnEpoch){
  if(waitForCutin(()=>comDiscard(expectedTurn,epoch)))return;
  if(gameOver||turn!==expectedTurn||turnEpoch!==epoch||phase!=="discard")return;
  const p=players[turn];let choices=p.hand.map((k,i)=>({k,i}));
  let bad=choices.filter(x=>!canUse(p,x.k));if(!bad.length)bad=choices;
  if(p.name==="シェフ"){
    const safe=bad.filter(x=>!players.some((o,j)=>j!==p.id&&canUse(o,x.k)));
    if(safe.length)bad=safe
  }
  discardFrom(turn,bad[rand(bad.length)].i)
}
function nextTurn(expectedTurn=turn,epoch=turnEpoch){
  if(waitForCutin(()=>nextTurn(expectedTurn,epoch)))return;
  if(gameOver||turn!==expectedTurn||turnEpoch!==epoch||phase!=="animating")return;
  turn=(turn+1)%players.length;
  startTurn()
}
function refillDeck(){if(discard.length>1){const top=discard.pop();deck=shuffle(discard.splice(0));discard=[top]}}
function checkWin(pid,delay=300){
  const p=players[pid];if(p.placed.length<6)return false;gameOver=true;beep("win");
  const others=players.filter((_,i)=>i!==pid);
  $("resultEmoji").innerHTML=
    '<div class="resultWinner"><img class="resultWinnerChar" src="'+charPath(p,"happy")+'" alt="'+p.name+'"><div class="resultWinnerName">'+p.name+' の かち！</div><img class="resultWinnerDish" src="'+recipeDishPath(p.recipe)+'" alt="'+(p.recipe?p.recipe.name:"")+'"><div class="resultWinnerMenu">'+(p.recipe?p.recipe.name:"")+'</div></div>'+
    '<div class="resultOthers">'+others.map(o=>'<div class="resultLoser"><img class="resultLoserChar" src="'+charPath(o,"sad")+'" alt="'+o.name+'"><img class="resultLoserDish" src="'+recipeDishPath(o.recipe)+'" alt="'+o.recipe.name+'"><div><div class="resultLoserName">'+o.name+'</div><div class="resultLoserMenu">'+o.recipe.name+'</div></div></div>').join("")+'</div>';
  $("resultTitle").textContent="できあがり！";
  $("resultText").textContent="みんなが つくっていた りょうりも みてみよう！";
  setTimeout(()=>{hideCutin();$("overlay").classList.add("show")},delay);return true
}
function restart(){hideCutin();$("overlay").classList.remove("show");show("start")}
</script>
