<head>

<title>レシピたいせん</title>
<style>
:root{--ink:#342d29;--line:#eadfd7;--shadow:0 7px 22px #6d4b3520}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff8ec,#fff1f5)}
button{font:inherit}.app{width:min(860px,100%);margin:auto;padding:8px 8px 24px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:7px}.back{border:0;background:#fff;border-radius:13px;padding:9px 11px;font-weight:900;box-shadow:0 3px 11px #0001}

.toggle{display:flex;align-items:center;justify-content:center;gap:11px;margin:18px 0 7px}.switch{position:relative;width:58px;height:34px;border:0;border-radius:30px;background:#d7cfca;padding:0}
.switch span{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:4px;left:4px;transition:.18s;box-shadow:0 2px 6px #0002}.switch.on{background:#8bd08b}.switch.on span{left:28px}
.recipePick{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:17px}.faceDown{min-height:125px;border:4px solid #fff;border-radius:21px;background:repeating-linear-gradient(45deg,#ffc8d7,#ffc8d7 10px,#ffe5eb 10px,#ffe5eb 20px);font-size:40px;box-shadow:0 5px 15px #0002}
.reveal{font-size:68px;margin:12px}.needList{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0}.needChip{padding:6px 8px;border-radius:13px;background:#fff1d8;font-size:13px;font-weight:900}

.board{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"left right" "table table" "you you";gap:6px}
.seat{background:#fff;border:2px solid transparent;border-radius:18px;padding:8px;box-shadow:var(--shadow);min-width:0;transition:background .25s,border-color .25s,box-shadow .25s,transform .2s}.seat.active{background:var(--turnColor,#fff4c9);border-color:var(--turnBorder,#efbd42);box-shadow:0 0 0 3px var(--turnGlow,#ffd96b55),0 7px 22px #6d4b3520}.leftSeat{grid-area:left}.rightSeat{grid-area:right}.youSeat{grid-area:you;padding:10px;position:relative}
.table{grid-area:table;background:var(--tableTurn,#fff9ef);position:relative;border-radius:20px;padding:10px;box-shadow:var(--shadow);text-align:center;transition:background .25s}
.who{display:flex;align-items:center;gap:7px;font-weight:1000}.avatar{width:54px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 54px}.avatarArt{width:54px;height:36px;object-fit:cover;border-radius:12px;border:2px solid var(--turnBorder,#eadfd7);box-shadow:0 2px 7px #0001;background:#fff}.rouletteChar{width:132px;height:160px;object-fit:contain;display:block;margin:auto}.foodCardArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.counterIcon{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:cover;border-radius:7px}.discardArt{width:64px;height:72px;object-fit:cover;border-radius:10px}.recipeRevealImg{display:block;width:min(270px,80%);max-height:330px;object-fit:contain;margin:12px auto;border-radius:18px;box-shadow:0 5px 16px #0002}.resultChar{display:block;width:220px;max-width:80%;aspect-ratio:2/1;object-fit:cover;border-radius:22px;margin:0 auto 10px;border:4px solid #fff;box-shadow:0 4px 14px #0002}.resultDish{display:block;width:220px;max-width:80%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;margin:8px auto}
.counter{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:7px}.youSeat .counter{width:92%;margin:7px auto 0}.slot{position:relative;aspect-ratio:.78;border-radius:9px;border:1px solid #e2d5cc;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.slot .cardface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;font-size:10px;font-weight:900;background:#fff9ed;overflow:hidden}
.slot.empty{border:2px dashed #dbcfc6;background:#faf8f6}.slot.self-hidden .veil{position:absolute;inset:0;background:rgba(0,0,0,.50)}.slot.preview .veil{position:absolute;inset:0;background:rgba(255,255,255,.68)}.slot.public{border:2px solid #9dce9e}
.comMeta{display:flex;justify-content:space-between;gap:5px;margin-top:5px;font-size:11px;opacity:.68}.recipeLabel{font-size:12px;font-weight:1000;margin-top:4px}
.myPlay{display:block;margin-top:2px}.myDishBox{position:absolute;top:8px;right:8px;width:58px;padding:0;text-align:center;z-index:2}.myDishImg{display:block;width:58px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;filter:saturate(.72) contrast(.94);opacity:.88;box-shadow:0 2px 7px #00000012}.myDishLabel{display:none}.handWrap{min-width:0;width:100%}.hand{display:flex;justify-content:center;align-items:flex-end;overflow:hidden;padding:10px 8px 8px;height:122px;width:100%;max-width:100%}
.handCard{flex:0 0 84px;border:2px solid #e4d8cf;border-radius:14px;background:#fff;height:108px;padding:0;font-size:11px;font-weight:900;position:relative;transition:transform .12s,border-color .12s,box-shadow .12s;z-index:1;overflow:hidden}
.handCard+.handCard{margin-left:-22px}.hand.crowded .handCard+.handCard{margin-left:-31px}.hand.veryCrowded .handCard+.handCard{margin-left:-38px}.handCard.need::after{content:"★";position:absolute;right:3px;top:1px;font-size:16px}.handCard.canDiscard{border-color:#ffad63}.handCard.selected{transform:translateY(-10px);z-index:8;border-color:#ff8fa9;box-shadow:0 7px 16px #0002}.handCard.needNow.selected{border-color:#58bf7d;box-shadow:0 0 0 3px #9bdc9b66,0 7px 16px #0002}
.discard.targetReady{border-color:#ff9f62;background:#fff4e8;box-shadow:0 0 0 4px #ffb17755}.counter.targetReady{border-radius:12px;background:#f2fff4;box-shadow:0 0 0 4px #6fca8d55}.counterHint{font-size:11px;font-weight:900;opacity:.72;margin-top:5px}
.piles{display:flex;justify-content:center;gap:8px;align-items:center}.pile{width:88px;height:104px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:1000}
.deck{border:0;background:repeating-linear-gradient(45deg,#ffd991,#ffd991 9px,#ffecbe 9px,#ffecbe 18px)}.discard{background:#fff;border:2px solid #e5d9d1;padding:7px;text-align:center}
.recipeBtn{border:0;font-size:17px;font-weight:1000;background:#ff9db4;color:#fff;box-shadow:0 4px 12px #ff9db455;transition:.18s}.recipeBtn.ready{animation:recipePulse .8s ease-in-out infinite alternate}.recipeBtn.easyDisabled{filter:grayscale(1);opacity:.42}.handCard.needNow{border-color:#7bc77b;box-shadow:0 0 0 3px #9bdc9b55}.motionCard{position:fixed;z-index:1000;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px solid #d9cec6;border-radius:12px;padding:4px;font-size:11px;font-weight:900;box-shadow:0 7px 18px #0003;transition:transform .32s ease-in-out,opacity .32s}.flash{animation:flash .35s ease-out}.placeFlash{animation:placeFlash .4s ease-out}@keyframes recipePulse{from{transform:scale(1)}to{transform:scale(1.05)}}@keyframes flash{50%{transform:scale(1.08);background:#fff1b8}}@keyframes placeFlash{50%{transform:scale(1.04);box-shadow:0 0 0 5px #9bdc9b55}}
.status{margin-top:8px;padding:8px;border-radius:13px;background:#fff;min-height:44px;font-weight:900;line-height:1.4}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:12px;z-index:20}.overlay.show{display:flex}.modal{width:min(520px,100%);max-height:94svh;overflow:auto;background:#fff;border-radius:28px;padding:18px;text-align:center}.modal h2{font-size:28px;margin:4px}.modal button{border:0;border-radius:15px;padding:12px 15px;font-weight:1000;background:#ffd39c}.resultBoard{display:flex;flex-direction:column;gap:10px;align-items:center}.resultWinner{width:100%;padding:12px;border-radius:22px;background:linear-gradient(180deg,#fff8cf,#fff);box-shadow:0 5px 16px #0001}.resultWinnerChar{display:block;width:min(280px,90%);aspect-ratio:2/1;object-fit:cover;border-radius:18px;margin:0 auto 8px}.resultWinnerDish{display:block;width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;margin:0 auto 6px}.resultWinnerName{font-size:18px;font-weight:1000}.resultWinnerMenu{font-size:22px;font-weight:1000}.resultOthers{width:100%;display:flex;flex-direction:column;gap:8px}.resultLoser{display:grid;grid-template-columns:108px 62px 1fr;gap:8px;align-items:center;text-align:left;background:#faf7f5;border-radius:16px;padding:7px}.resultLoserChar{width:108px;aspect-ratio:2/1;object-fit:cover;border-radius:12px}.resultLoserDish{width:62px;aspect-ratio:1/1;object-fit:cover;border-radius:11px}.resultLoserName{font-size:12px;font-weight:900;opacity:.65}.resultLoserMenu{font-size:14px;font-weight:1000;line-height:1.25}
@media(max-width:560px){.myDishBox{top:8px;right:8px;width:54px}.myDishImg{width:54px}.hand{height:114px;padding:8px 4px 7px}.handCard{flex-basis:78px;height:102px}.handCard+.handCard{margin-left:-38px}.hand.crowded .handCard+.handCard{margin-left:-43px}.hand.veryCrowded .handCard+.handCard{margin-left:-48px}.resultLoser{grid-template-columns:96px 54px 1fr;gap:6px}.resultLoserChar{width:96px}.resultLoserDish{width:54px}.slot .cardface{font-size:9px}.recipePick{grid-template-columns:repeat(2,1fr)}}
.cutinLayer{position:fixed;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .13s; background:#fff8f070}
.cutinLayer.show{opacity:1;visibility:visible}.cutinStage{position:relative;width:min(360px,95vw);height:335px;filter:drop-shadow(0 7px 12px #58445228);animation:cutinPop .3s cubic-bezier(.2,1.3,.3,1)}
.cutinCard{position:absolute;width:172px;height:172px;object-fit:cover;top:77px;left:calc(50% - 70px);border-radius:17px;border:4px solid #fff;box-shadow:0 8px 18px #6e4e4b30;transform:rotate(-7deg)}
.cutinCard.multi0{transform:translate(-29px,9px) rotate(-12deg)}.cutinCard.multi1{transform:translate(16px,-7px) rotate(8deg)}.cutinCard.multi2{transform:translate(0,0) rotate(-3deg)}
.cutinActor{position:absolute;bottom:50px;left:9px;height:112px;max-width:146px;object-fit:contain;filter:drop-shadow(0 3px 2px #fff) drop-shadow(0 -3px 2px #fff) drop-shadow(3px 0 2px #fff) drop-shadow(-3px 0 2px #fff)}
.cutinSurprise{position:absolute;right:0;top:53px;width:158px;aspect-ratio:2/1;object-fit:cover;border:4px solid #fff;border-radius:18px;box-shadow:0 6px 15px #6e4e4b44;transform:rotate(5deg)}
.cutinHeadline{position:absolute;top:0;left:0;right:0;text-align:center;font-size:29px;font-weight:1000;letter-spacing:.03em;color:#87587e;text-shadow:-2px -2px #fff,2px 2px #fff,2px -2px #fff,-2px 2px #fff}
.cutinHeadline.claim{font-size:43px;color:#e9839d}.cutinSub{position:absolute;left:4px;right:4px;bottom:0;text-align:center;background:#fffffff2;border:2px solid #f3dce6;border-radius:16px;padding:7px 10px;font-weight:1000;font-size:15px}
.cutinCount{position:absolute;top:215px;right:16px;font-size:18px;font-weight:1000;background:#fff;border-radius:20px;padding:5px 12px;color:#855a9b}
.deck{background:#f7ecfb}.deckBack{width:62px;height:62px;object-fit:cover;border-radius:9px;display:block;margin:auto}
@keyframes cutinPop{from{transform:translateY(24px) scale(.82)}to{transform:translateY(0) scale(1)}}
@media(max-width:360px){.cutinStage{transform:scale(.87)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="back" onclick="location.href='index.html'">← もどる</button><h1>🍳 レシピたいせん</h1></div>

  <section id="start" class="screen active">
    <div class="panel center">
      <div class="title">3にんで レシピたいせん！</div>
      <div class="sub">ねこさん・おねえさん・シェフ から、対戦相手がランダムで2人えらばれるよ</div>
      <div class="toggle"><b>かんたんモード</b><button id="easySwitch" class="switch on" onclick="toggleEasy()"><span></span></button><span id="easyText">ON</span></div>
      <div class="sub">ON：必要な手札に★。取れないときの「レシピ！」はグレーになります。</div>
      <br><button class="bigbtn" onclick="showRecipePick()">ゲームスタート</button>
    </div>
  </section>

  <section id="pick" class="screen"><div class="panel center"><div class="title">レシピカードを 1まい えらんでね</div><div class="sub">6まいとも うらむき</div><div id="recipePick" class="recipePick"></div></div></section>
  <section id="reveal" class="screen"><div class="panel center"><div class="title">あなたの レシピは…</div><div id="revealFood" class="reveal"></div><div id="revealName" class="title"></div><div id="revealNeeds" class="needList"></div><br><button class="bigbtn" onclick="startRoulette()">つぎへ</button></div></section>
  <section id="rouletteScreen" class="screen"><div class="panel center"><div class="title">さいしょは だれ？</div><div id="roulette" class="roulette">🎲</div><div id="rouletteName" class="title">ルーレット！</div><br><button id="rouletteBtn" class="bigbtn" onclick="spinRoulette()">スタート！</button></div></section>

  <section id="game" class="screen">
    <div class="board">
      <div id="seat1" class="seat leftSeat"></div>
      <div id="seat2" class="seat rightSeat"></div>
      <div class="table">
        <div id="turnText" class="title" style="font-size:18px"></div>
        <div class="piles">
          <button id="deckBtn" class="pile deck" onclick="humanDraw()"><img class="deckBack" src="assets/recipe/backs/card-back-flower-icon.webp" alt=""><span>やまふだ <span id="deckCount"></span></span></button>
          <button id="discardPile" class="pile discard" onclick="humanDiscardSelected()"><b>すてば</b></button>
          <button id="recipeBtn" class="pile recipeBtn" onclick="humanRecipe()">いただき！</button>
        </div>
        <div id="status" class="status"></div>
      </div>
      <div id="seat0" class="seat youSeat"></div>
    </div>
  </section>
</div>

<div id="cutinLayer" class="cutinLayer" aria-live="polite"><div id="cutinStage" class="cutinStage"></div></div>
<div id="overlay" class="overlay"><div class="modal"><div id="resultEmoji" class="big"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button onclick="restart()">もういちど</button></div></div>

<script>
const ASSET="assets/recipe";
const ITEMS={
rice:"ごはん",bread:"パン",pasta:"パスタ",flour:"こむぎこ",egg:"たまご",milk:"ぎゅうにゅう",cream:"クリーム",butter:"バター",cheese:"チーズ",icecream:"アイス",
onion:"たまねぎ",carrot:"にんじん",potato:"じゃがいも",tomato:"トマト",cucumber:"きゅうり",lettuce:"レタス",mushroom:"きのこ",
meat:"おにく",chicken:"とりにく",bacon:"ベーコン",ham:"ハム",ketchup:"ケチャップ",curry:"カレールウ",sugar:"さとう",
strawberry:"いちご",banana:"バナナ",shrimp:"エビ",squid:"イカ"
};
const FOOD_SLUG={
rice:"rice",bread:"bread",pasta:"pasta",flour:"flour",egg:"egg",milk:"milk",cream:"cream",butter:"butter",cheese:"cheese",icecream:"icecream",
onion:"onion",carrot:"carrot",potato:"potato",tomato:"tomato",cucumber:"cucumber",lettuce:"lettuce",mushroom:"mushroom",
meat:"meat",chicken:"chicken",bacon:"bacon",ham:"ham",ketchup:"ketchup",curry:"curryroux",sugar:"sugar",strawberry:"strawberry",banana:"banana",shrimp:"shrimp",squid:"squid"
};
const CHAR_KEY={"あなた":"you","ねこさん":"cat","おねえさん":"sister","シェフ":"chef"};
function foodCardPath(k){return ASSET+"/ingredients/cards/ingredient-"+FOOD_SLUG[k]+".webp"}
function foodIconPath(k){return ASSET+"/ingredients/icons/ingredient-"+FOOD_SLUG[k]+"-icon.webp"}
function charPath(p,expr="relaxed"){const key=CHAR_KEY[p.name]||"you";return ASSET+"/chars/"+key+"/expressions/char-"+key+"-"+expr+".webp"}
function standingPath(p){const key=CHAR_KEY[p.name]||"you";return ASSET+"/chars/"+key+"/standing/char-"+key+"-standing.png"}
function charHTML(p,cls="avatarArt",expr="relaxed",standing=false){return '<img class="'+cls+'" src="'+(standing?standingPath(p):charPath(p,expr))+'" alt="'+p.name+'">'}
function recipeCardPath(r){return ASSET+"/recipes/cards/recipe-"+r.file+".webp"}
function recipeDishPath(r){return ASSET+"/recipes/dishes/recipe-"+r.file+"-dish.webp"}
const CARD_BACK=ASSET+"/backs/card-back-cafe-mogumogu.webp";
const MENU_BACK=ASSET+"/backs/menu-card-back-cafe-mogumogu.webp";

const RECIPES=[
{name:"カレー",emoji:"🍛",file:"curry",need:["rice","onion","carrot","potato","meat","curry"]},
{name:"オムライス",emoji:"🍳",file:"omelet-rice",need:["rice","egg","onion","chicken","ketchup","butter"]},
{name:"グラタン",emoji:"🧀",file:"gratin",need:["milk","cheese","onion","mushroom","butter","flour"]},
{name:"ナポリタン",emoji:"🍝",file:"napolitan",need:["pasta","tomato","onion","mushroom","bacon","ketchup"]},
{name:"サンドイッチ",emoji:"🥪",file:"sandwich",need:["bread","lettuce","ham","cucumber","egg","cheese"]},
{name:"いちごケーキ",emoji:"🍰",file:"strawberry-cake",need:["flour","egg","milk","sugar","strawberry","cream"]},
{name:"パンケーキ",emoji:"🥞",file:"pancake",need:["flour","egg","milk","butter","strawberry","cream"]},
{name:"フルーツサンド",emoji:"🥪",file:"fruit-sandwich",need:["bread","cream","strawberry","banana","milk","sugar"]},
{name:"プリンアラモード",emoji:"🍮",file:"pudding-a-la-mode",need:["egg","milk","sugar","cream","strawberry","banana"]},
{name:"フレンチトースト",emoji:"🍞",file:"french-toast",need:["bread","egg","milk","butter","sugar","strawberry"]},
{name:"ピザトースト",emoji:"🍕",file:"pizza-toast",need:["bread","tomato","cheese","onion","bacon","ketchup"]},
{name:"クリームパスタ",emoji:"🍝",file:"cream-pasta",need:["pasta","cream","milk","cheese","bacon","mushroom"]},
{name:"バナナパンケーキ",emoji:"🥞",file:"banana-pancake",need:["flour","egg","milk","butter","banana","cream"]},
{name:"ポテトグラタン",emoji:"🥔",file:"potato-gratin",need:["potato","cream","milk","cheese","onion","bacon"]},
{name:"ハムチーズトースト",emoji:"🍞",file:"ham-cheese-toast",need:["bread","ham","cheese","butter","tomato","lettuce"]},
{name:"シーフードカレー",emoji:"🍛",file:"seafood-curry",need:["rice","onion","carrot","shrimp","squid","curry"]},
{name:"シーフードグラタン",emoji:"🧀",file:"seafood-gratin",need:["milk","cheese","onion","shrimp","squid","flour"]},
{name:"シーフードクリームパスタ",emoji:"🍝",file:"seafood-cream-pasta",need:["pasta","cream","milk","shrimp","squid","mushroom"]},
{name:"シーフードピザ",emoji:"🍕",file:"seafood-pizza",need:["flour","tomato","cheese","onion","shrimp","squid"]},
{name:"ミックスピザ",emoji:"🍕",file:"mixed-pizza",need:["flour","tomato","cheese","onion","bacon","mushroom"]}
];
const USER={name:"あなた",avatar:"",human:true,skill:1,color:"#ffe0ea",border:"#f3a9c1",glow:"#f3a9c155"};
const COMS=[
{name:"ねこさん",avatar:"",human:false,skill:.58,color:"#fff0ad",border:"#e7c85d",glow:"#e7c85d55"},
{name:"おねえさん",avatar:"",human:false,skill:.84,color:"#e4f2bd",border:"#a9c96b",glow:"#a9c96b55"},
{name:"シェフ",avatar:"",human:false,skill:.97,color:"#dcefff",border:"#8fc5e8",glow:"#8fc5e855"}
];

let easy=true,players=[],deck=[],discard=[],turn=0,phase="idle",pending=null,gameOver=false,selectedIndex=null;
let rouletteTimer=null,rouletteRunning=false,rouletteCurrent=0,rouletteStartedAt=0;
let cutinTimer=null;
function showCutin({actor,cards=[],hidden=false,title="",subtitle="",surprised=null,duration=850}){
  const layer=$("cutinLayer"),stage=$("cutinStage");
  clearTimeout(cutinTimer);
  const shown=cards.slice(0,3);
  const stack=shown.length>1;
  const cardImgs=shown.map((card,i)=>'<img class="cutinCard'+(stack?' multi'+i:'')+'" src="'+(hidden?CARD_BACK:foodCardPath(card))+'" alt="'+(hidden?"うらむきカード":ITEMS[card])+'">').join("");
  stage.innerHTML='<div class="cutinHeadline'+(surprised?" claim":"")+'">'+title+'</div>'+
    cardImgs+
    '<img class="cutinActor" src="'+standingPath(actor)+'" alt="'+actor.name+'">'+
    (surprised?'<img class="cutinSurprise" src="'+charPath(surprised,"surprised")+'" alt="'+surprised.name+'のびっくりした顔">':'')+
    (cards.length>3?'<span class="cutinCount">+'+(cards.length-3)+'まい</span>':'')+
    '<div class="cutinSub">'+subtitle+'</div>';
  layer.classList.remove("show");
  void layer.offsetWidth;
  layer.classList.add("show");
  cutinTimer=setTimeout(()=>{layer.classList.remove("show");stage.innerHTML=""},duration);
}
function hideCutin(){clearTimeout(cutinTimer);$("cutinLayer").classList.remove("show");$("cutinStage").innerHTML=""}
let audioCtx=null;
function audio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function beep(type){
  const a=audio(),now=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);
  const cfg={
    discard:[180,.045,"square"],draw:[520,.08,"sine"],place:[260,.07,"triangle"],
    recipe:[760,.12,"sine"],error:[130,.09,"square"],turn:[420,.04,"sine"],win:[660,.12,"sine"]
  }[type]||[300,.05,"sine"];
  o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);
  if(type==="draw")o.frequency.exponentialRampToValueAtTime(800,now+cfg[1]);
  if(type==="recipe")o.frequency.setValueAtTime(980,now+.07);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.11,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+cfg[1]);
  o.start(now);o.stop(now+cfg[1]+.02);
  if(type==="win")setTimeout(()=>{beep("recipe")},120);
}
function rectCenter(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}}
function flyCard(label,fromEl,toEl,done){
  if(!fromEl||!toEl){done?.();return}
  const a=rectCenter(fromEl),b=rectCenter(toEl);
  const ghost=document.createElement("div");ghost.className="motionCard";ghost.textContent=label;
  ghost.style.width=Math.max(52,Math.min(72,a.w||64))+"px";ghost.style.height=Math.max(64,Math.min(88,a.h||80))+"px";
  ghost.style.left=(a.x-32)+"px";ghost.style.top=(a.y-38)+"px";
  document.body.appendChild(ghost);
  requestAnimationFrame(()=>{ghost.style.transform="translate("+(b.x-a.x)+"px,"+(b.y-a.y)+"px) scale(.92)";ghost.style.opacity=".78"});
  setTimeout(()=>{ghost.remove();done?.()},340);
}
function flashEl(el,cls="flash"){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),450)}


function $(id){return document.getElementById(id)}
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function toggleEasy(){easy=!easy;$("easySwitch").classList.toggle("on",easy);$("easyText").textContent=easy?"ON":"OFF";if($("game").classList.contains("active"))render()}

function showRecipePick(){
  const b=$("recipePick");b.innerHTML="";
  for(let i=0;i<6;i++)b.innerHTML+='<button class="faceDown" onclick="chooseRecipe('+i+')"><img src="'+MENU_BACK+'" alt="うらむきメニューカード" style="height:130px;max-width:100%;object-fit:contain;border-radius:14px"></button>';
  show("pick")
}

function chooseRecipe(i){
  const shuffledRecipes=shuffle([...RECIPES]),mine=shuffledRecipes[i],rest=shuffledRecipes.filter((_,x)=>x!==i);
  const opponents=shuffle([...COMS]).slice(0,2);
  players=[USER,...opponents].map((p,idx)=>({...p,id:idx,recipe:null,hand:[],placed:[]}));
  players[0].recipe=mine;players[1].recipe=rest[0];players[2].recipe=rest[1];
  $("revealFood").innerHTML='<img class="recipeRevealImg" src="'+recipeCardPath(mine)+'" alt="'+mine.name+'">';$("revealName").textContent=mine.name;
  $("revealNeeds").innerHTML=mine.need.map(k=>'<span class="needChip">'+ITEMS[k]+'</span>').join("");
  show("reveal")
}

function startRoulette(){hideCutin();buildDeck();show("rouletteScreen");$("roulette").textContent="🎲";$("rouletteName").textContent="ルーレット！";$("rouletteBtn").disabled=false}
function buildDeck(){
  let a=[];Object.keys(ITEMS).forEach(k=>a.push(k,k,k,k));deck=shuffle(a);discard=[];gameOver=false;
  players.forEach(p=>{
    p.hand=[];p.placed=[];
    for(let i=0;i<6;i++)p.hand.push(deck.pop());
  })
}

function autoPlaceInitialNeeded(){
  const moved=[];
  players.forEach(p=>{
    const cards=[];
    for(let i=p.hand.length-1;i>=0;i--){
      const card=p.hand[i];
      if(canUse(p,card)){
        p.hand.splice(i,1);
        p.placed.push({card,public:false});
        cards.push(card);
      }
    }
    moved.push(cards);
  });
  render();
  players.forEach((p,i)=>{
    if(moved[i].length)flashEl($("seat"+i),"placeFlash");
  });
  if(moved[0].length)showCutin({actor:players[0],cards:moved[0].reverse(),title:"じゅんび OK！",subtitle:"つかえる しょくざいを カウンターに いどうしたよ！",duration:1800});
  if(moved.some(a=>a.length))beep("place");
  setStatus("つかえる しょくざいを カウンターに いどうしたよ！");
}
function spinRoulette(){
  const btn=$("rouletteBtn");
  if(!rouletteRunning){
    rouletteRunning=true;rouletteStartedAt=Date.now();btn.textContent="ストップ！";
    rouletteTimer=setInterval(()=>{
      rouletteCurrent=(rouletteCurrent+1)%players.length;
      const p=players[rouletteCurrent];
      $("roulette").innerHTML=charHTML(p,"rouletteChar","relaxed",true);
      $("rouletteName").textContent=p.name;
    },95);
    return;
  }

  // 子どものダブルタップで開始直後に止まらないよう、短い連打だけ無視する。
  if(Date.now()-rouletteStartedAt<350)return;

  rouletteRunning=false;
  if(rouletteTimer){clearInterval(rouletteTimer);rouletteTimer=null}
  btn.disabled=true;btn.textContent="ストップ！";
  turn=rouletteCurrent;
  const p=players[turn];
  $("roulette").innerHTML=charHTML(p,"rouletteChar","relaxed",true);
  $("rouletteName").textContent=p.name+" から スタート！";
  setTimeout(()=>{
    show("game");
    phase="setup";
    setStatus("さいしょの てふだを みてみよう！");
    render();
    setTimeout(()=>{
      autoPlaceInitialNeeded();
      setTimeout(()=>startTurn(),1950);
    },1200);
  },650)
}
function startTurn(){
  if(gameOver)return;
  document.querySelectorAll(".motionCard").forEach(x=>x.remove());
  selectedIndex=null;phase="discard";const p=players[turn];beep("turn");
  setStatus(p.human?"てふだから 1まい すててね。":p.name+" の ばん！");render();
  if(!p.human)setTimeout(comDiscard,1300+rand(900))
}

function render(){
  players.forEach((p,i)=>renderSeat(p,i));
  const d=discard.at(-1);
  $("discardPile").innerHTML=d?'<img class="discardArt" src="'+foodCardPath(d)+'" alt="'+ITEMS[d]+'"><small>すてば</small>':'<b>すてば</b>';
  $("deckCount").textContent=deck.length+"まい";
  $("turnText").textContent=players[turn].name+" の ばん";
  document.querySelector(".table").style.setProperty("--tableTurn",players[turn].color);
  $("deckBtn").disabled=!(turn===0&&phase==="draw");
  const canRecipe=!!(pending&&pending.from!==0&&canUse(players[0],pending.card));
  $("recipeBtn").classList.toggle("easyDisabled",easy&&!canRecipe);$("recipeBtn").classList.toggle("ready",canRecipe);

  const selectedCard=selectedIndex!==null?players[0].hand[selectedIndex]:null;
  const canAct=turn===0&&phase==="discard"&&selectedCard;
  $("discardPile").classList.toggle("targetReady",!!canAct);
  const myCounter=document.querySelector("#seat0 .counter");
  if(myCounter)myCounter.classList.toggle("targetReady",!!(canAct&&canUse(players[0],selectedCard)));
}

function renderSeat(p,i){
  const el=$("seat"+i);
  el.classList.toggle("active",i===turn);
  el.style.setProperty("--turnColor",p.color);
  el.style.setProperty("--turnBorder",p.border);
  el.style.setProperty("--turnGlow",p.glow);
  const counter=counterHTML(p,i===0);
  let body='<div class="who"><span class="avatar">'+charHTML(p)+'</span>'+p.name+'</div>';
  if(i===0){
    body+='<div class="myPlay"><div class="myDishBox"><img class="myDishImg" src="'+recipeDishPath(p.recipe)+'" alt="'+p.recipe.name+'"></div>'+
      '<div class="handWrap"><div class="hand '+(p.hand.length>=9?"veryCrowded":p.hand.length>=7?"crowded":"")+'" id="myHand">'+
      p.hand.map((k,idx)=>handCardHTML(k,idx)).join("")+'</div></div></div>'+
      '<div class="recipeLabel">キッチンカウンター '+p.placed.length+'/6</div>'+counter+
      '<div class="counterHint">必要なカードをえらんだら、カウンターをタップ</div>';
  }else{
    body+='<div class="recipeLabel">キッチンカウンター '+p.placed.length+'/6</div>'+counter+
      '<div class="comMeta"><span>てふだ '+p.hand.length+'まい</span><span>レシピは ひみつ</span></div>';
  }
  el.innerHTML=body
}

function counterHTML(p,isMe){
  return '<div class="counter" '+(isMe?'onclick="humanCounterTap()"':'')+'>'+p.recipe.need.map(k=>{
    const x=p.placed.find(q=>q.card===k);
    if(!x){
      if(isMe)return '<div class="slot preview" data-key="'+k+'"><div class="cardface"><img class="counterIcon" src="'+foodIconPath(k)+'" alt="'+ITEMS[k]+'"></div><div class="veil"></div></div>';
      return '<div class="slot empty"></div>';
    }
    if(x.public)return '<div class="slot public" data-key="'+k+'"><div class="cardface"><img class="counterIcon" src="'+foodIconPath(k)+'" alt="'+ITEMS[k]+'"></div></div>';
    if(isMe)return '<div class="slot self-hidden" data-key="'+k+'"><div class="cardface"><img class="counterIcon" src="'+foodIconPath(k)+'" alt="'+ITEMS[k]+'"></div><div class="veil"></div></div>';
    return '<div class="slot self-hidden" data-key="'+k+'"><div class="cardface"></div><div class="veil"></div></div>';
  }).join("")+'</div>'
}

function handCardHTML(k,i){
  const need=easy&&canUse(players[0],k);
  const sel=selectedIndex===i;
  return '<button aria-label="'+ITEMS[k]+'" title="'+ITEMS[k]+'" class="handCard '+(need?"need ":"")+(turn===0&&phase==="discard"?"canDiscard ":"")+(turn===0&&phase==="discard"&&canUse(players[0],k)?"needNow ":"")+(sel?"selected":"")+'" data-i="'+i+'" onclick="humanCardTap('+i+')"><img class="foodCardArt" src="'+foodCardPath(k)+'" alt="'+ITEMS[k]+'"></button>'
}

function setStatus(t){$("status").textContent=t}
function canUse(p,k){return p.recipe.need.includes(k)&&!p.placed.some(x=>x.card===k)}
function humanCardTap(i){
  if(gameOver)return;
  selectedIndex=(selectedIndex===i?null:i);
  if(turn===0&&phase==="discard"&&selectedIndex!==null){
    const card=players[0].hand[i];
    setStatus(canUse(players[0],card)?ITEMS[card]+" をえらんだよ。カウンターか すてばをタップしてね。":ITEMS[card]+" をえらんだよ。すてばをタップしてね。");
  }else if(turn===0&&phase==="discard"){
    setStatus("てふだから 1まい えらんでね。");
  }
  render()
}
function humanCounterTap(){
  if(turn!==0||phase!=="discard"||gameOver){beep("error");return}
  const p=players[0];
  if(selectedIndex===null||!p.hand[selectedIndex]){beep("error");setStatus("まず てふだを 1まいえらんでね。");return}
  if(!canUse(p,p.hand[selectedIndex])){beep("error");setStatus("そのカードは カウンターに出せないよ。");return}
  const i=selectedIndex;selectedIndex=null;placeFromHand(i)
}
function humanDiscardSelected(){
  if(turn!==0||phase!=="discard"||gameOver){beep("error");return}
  const p=players[0];
  if(selectedIndex===null||!p.hand[selectedIndex]){beep("error");setStatus("まず すてるカードを 1まいえらんでね。");return}
  const i=selectedIndex;selectedIndex=null;discardFrom(0,i)
}
function placeFromHand(i){
  const p=players[0],card=p.hand[i];selectedIndex=null;
  if(!canUse(p,card))return;
  const from=document.querySelector('#myHand .handCard[data-i="'+i+'"]');
  const to=document.querySelector('#seat0 .slot[data-key="'+card+'"]');
  phase="animating";setStatus(ITEMS[card]+" を キッチンカウンターに おくよ。");
  flyCard(ITEMS[card],from,to,()=>{
    p.hand.splice(i,1);p.placed.push({card,public:false});beep("place");render();
    flashEl(document.querySelector('#seat0 .slot[data-key="'+card+'"]'),"placeFlash");
    showCutin({actor:p,cards:[card],title:"やったね！",subtitle:ITEMS[card]+" を おいたよ！",duration:2000});
    if(checkWin(0,2200))return;
    setTimeout(()=>{
      if(gameOver)return;
      phase="discard";setStatus("つぎに てふだから 1まい すててね。");render();
    },2050);
  })
}

function discardFrom(pid,i){
  if(pid===0)selectedIndex=null;

  // 前の人の捨て札への「レシピ！」は、この人が次の捨て札を選ぶ瞬間まで有効。
  // 新しい捨て札を出し始めた時点で、ひとつ前の権利だけを締め切る。
  pending=null;

  const p=players[pid],card=p.hand[i];
  const from=pid===0?document.querySelector('#myHand .handCard[data-i="'+i+'"]'):$("seat"+pid);
  const to=$("discardPile");
  phase="animating";setStatus(p.name+" が カードを すてます。");
  flyCard(ITEMS[card],from,to,()=>{
    p.hand.splice(i,1);discard.push(card);pending={from:pid,card};beep("discard");
    if(pid===0){
      phase="draw";
      setStatus(ITEMS[card]+" を すてた。すぐに やまふだから ひけるよ！");
    }else{
      phase="claim";
      setStatus(p.name+" が "+ITEMS[card]+" を すてた！");
    }
    render();flashEl($("discardPile"));
    setTimeout(()=>resolveClaims(pid,card),520)
  })
}

function resolveClaims(from,card){
  if(gameOver)return;
  const order=[];for(let s=1;s<players.length;s++)order.push((from+s)%players.length);

  // 自分が捨てた直後は、山札操作を止めない。
  if(from!==0&&turn===from&&phase==="claim")render();

  const humanCanClaim=from!==0&&canUse(players[0],card);
  if(humanCanClaim)setStatus("「レシピ！」できるか すてふだを みてね。");

  // CPUも即決しない。少し考えてから判断する。
  // 人間のレシピ！は時間では締め切らない。次の人が自分の捨て札を選ぶまで pending を残す。
  setTimeout(()=>{
    if(gameOver||!pending||pending.from!==from||pending.card!==card)return;
    for(const id of order){
      if(id===0)continue;
      const p=players[id];
      if(canUse(p,card)&&Math.random()<p.skill){takeDiscard(id,card,from);return}
    }
    // COMの通常処理だけここから山札へ進める。人間はすでに引ける状態。
    if(from!==0&&turn===from&&phase==="claim")finishClaimWindow(from)
  },950+rand(650))
}

function humanRecipe(){
  const canClaim=!!(pending&&pending.from!==0&&canUse(players[0],pending.card));
  if(easy&&!canClaim){beep("error");return;}
  if(!pending||pending.from===0){beep("error");setStatus("いまは とれないよ！");return}
  const card=pending.card;
  if(!canUse(players[0],card)){beep("error");setStatus("これは とれないよ！");return}
  takeDiscard(0,card,pending.from)
}

function takeDiscard(pid,card,from){
  const fromEl=$("discardPile"),toEl=$("seat"+pid);
  const resumeTurn=turn,resumePhase=phase;
  const wasWaitingForClaim=(resumeTurn===from&&resumePhase==="claim");
  phase="animating";setStatus("「いただき！」 "+players[pid].name+"！");
  beep("recipe");
  flyCard(ITEMS[card],fromEl,toEl,()=>{
    if(discard.at(-1)===card)discard.pop();
    players[pid].placed.push({card,public:true});pending=null;
    setStatus("「いただき！」 "+players[pid].name+" が "+ITEMS[card]+" を とった！");
    render();flashEl($("seat"+pid),"placeFlash");
    showCutin({actor:players[pid],cards:[card],title:"いただき！",subtitle:players[pid].name+" が "+ITEMS[card]+" を ゲット！",surprised:players[from],duration:2500});
    if(checkWin(pid,2700))return;
    if(wasWaitingForClaim){
      setTimeout(()=>finishClaimWindow(from),2550)
    }else{
      setTimeout(()=>{if(gameOver)return;turn=resumeTurn;phase=resumePhase;render()},2550)
    }
  })
}

function finishClaimWindow(from){
  turn=from;phase="draw";const p=players[turn];
  setStatus(p.human?"やまふだから 1まい ひいてね。":p.name+" が やまふだから ひきます。");render();
  if(!p.human)setTimeout(()=>drawFor(turn),900+rand(650))
}

function humanDraw(){if(turn===0&&phase==="draw")drawFor(0)}
function drawFor(pid){
  if(deck.length===0)refillDeck();if(deck.length===0)return;
  const p=players[pid],card=deck[deck.length-1],fromEl=$("deckBtn"),toEl=$("seat"+pid);
  phase="animating";setStatus(p.name+" が やまふだから ひきます。");beep("draw");
  flyCard(pid===0?ITEMS[card]:"カード",fromEl,toEl,()=>{
    deck.pop();
    const placed=canUse(p,card);
    if(placed){
      p.placed.push({card,public:false});beep("place");
      setStatus(p.name+" は ひいたカードを キッチンカウンターに おいた。");
    }else{
      p.hand.push(card);setStatus(p.human?ITEMS[card]+" を ひいた。":p.name+" は カードを ひいた。")
    }
    render();flashEl($("seat"+pid),"placeFlash");
    if(placed)showCutin({actor:p,cards:[card],hidden:!p.human,title:"カウンターに おいたよ！",subtitle:p.human?ITEMS[card]+" を おいたよ！":p.name+" が 1まい おいたよ！",duration:1800});
    if(checkWin(pid,placed?2000:300))return;
    setTimeout(nextTurn,placed?1950:900+rand(650))
  })
}

function comDiscard(){
  const p=players[turn];let choices=p.hand.map((k,i)=>({k,i}));
  let bad=choices.filter(x=>!canUse(p,x.k));if(!bad.length)bad=choices;
  if(p.name==="シェフ"){
    const safe=bad.filter(x=>!players.some((o,j)=>j!==p.id&&canUse(o,x.k)));
    if(safe.length)bad=safe
  }
  discardFrom(turn,bad[rand(bad.length)].i)
}
function nextTurn(){turn=(turn+1)%players.length;startTurn()}
function refillDeck(){if(discard.length>1){const top=discard.pop();deck=shuffle(discard.splice(0));discard=[top]}}
function checkWin(pid,delay=300){
  const p=players[pid];if(p.placed.length<6)return false;gameOver=true;beep("win");
  const others=players.filter((_,i)=>i!==pid);
  $("resultEmoji").innerHTML=
    '<div class="resultWinner"><img class="resultWinnerChar" src="'+charPath(p,"happy")+'" alt="'+p.name+'"><div class="resultWinnerName">'+p.name+' の かち！</div><img class="resultWinnerDish" src="'+recipeDishPath(p.recipe)+'" alt="'+p.recipe.name+'"><div class="resultWinnerMenu">'+p.recipe.name+'</div></div>'+
    '<div class="resultOthers">'+others.map(o=>'<div class="resultLoser"><img class="resultLoserChar" src="'+charPath(o,"sad")+'" alt="'+o.name+'"><img class="resultLoserDish" src="'+recipeDishPath(o.recipe)+'" alt="'+o.recipe.name+'"><div><div class="resultLoserName">'+o.name+'</div><div class="resultLoserMenu">'+o.recipe.name+'</div></div></div>').join("")+'</div>';
  $("resultTitle").textContent="できあがり！";
  $("resultText").textContent="みんなが つくっていた りょうりも みてみよう！";
  setTimeout(()=>{hideCutin();$("overlay").classList.add("show")},delay);return true
}
function restart(){hideCutin();$("overlay").classList.remove("show");show("start")}
</script>
