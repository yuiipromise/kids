<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>レシピたいせん</title>
<style>
:root{--ink:#342d29;--line:#eadfd7;--shadow:0 7px 22px #6d4b3520}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff8ec,#fff1f5)}
button{font:inherit}.app{width:min(860px,100%);margin:auto;padding:8px 8px 24px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:7px}.back{border:0;background:#fff;border-radius:13px;padding:9px 11px;font-weight:900;box-shadow:0 3px 11px #0001}
h1{font-size:clamp(24px,7vw,36px);margin:0;flex:1;text-align:center}.screen{display:none}.screen.active{display:block}
.panel{background:#ffffffeb;border-radius:24px;padding:18px;box-shadow:var(--shadow)}.center{text-align:center}.title{font-size:23px;font-weight:1000}.sub{opacity:.7;line-height:1.55}
.bigbtn{border:0;border-radius:18px;background:linear-gradient(135deg,#ffbd72,#ff93ac);color:#fff;padding:14px 22px;font-size:18px;font-weight:1000;box-shadow:0 5px 15px #ff9a8c44}
.toggle{display:flex;align-items:center;justify-content:center;gap:11px;margin:18px 0 7px}.switch{position:relative;width:58px;height:34px;border:0;border-radius:30px;background:#d7cfca;padding:0}
.switch span{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:4px;left:4px;transition:.18s;box-shadow:0 2px 6px #0002}.switch.on{background:#8bd08b}.switch.on span{left:28px}
.recipePick{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:17px}.faceDown{min-height:125px;border:4px solid #fff;border-radius:21px;background:repeating-linear-gradient(45deg,#ffc8d7,#ffc8d7 10px,#ffe5eb 10px,#ffe5eb 20px);font-size:40px;box-shadow:0 5px 15px #0002}
.reveal{font-size:68px;margin:12px}.needList{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0}.needChip{padding:6px 8px;border-radius:13px;background:#fff1d8;font-size:13px;font-weight:900}
.roulette{font-size:78px;min-height:96px;margin:16px 0 6px}
.board{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"left right" "table table" "you you";gap:6px}
.seat{background:#fff;border:2px solid transparent;border-radius:18px;padding:8px;box-shadow:var(--shadow);min-width:0;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}.seat.active{background:#fff4c9;border-color:#efbd42;box-shadow:0 0 0 3px #ffd96b55,0 7px 22px #6d4b3520}.leftSeat{grid-area:left}.rightSeat{grid-area:right}.youSeat{grid-area:you;padding:10px}
.table{grid-area:table;background:#fff9ef;position:relative;border-radius:20px;padding:10px;box-shadow:var(--shadow);text-align:center}
.who{display:flex;align-items:center;gap:6px;font-weight:1000}.avatar{font-size:25px}
.counter{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:7px}.slot{position:relative;aspect-ratio:.78;border-radius:9px;border:1px solid #e2d5cc;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.slot .cardface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;font-size:10px;font-weight:900;background:#fff9ed}
.slot.empty{border:2px dashed #dbcfc6;background:#faf8f6}.slot.self-hidden .veil{position:absolute;inset:0;background:rgba(0,0,0,.50)}.slot.preview .veil{position:absolute;inset:0;background:rgba(255,255,255,.68)}.slot.public{border:2px solid #9dce9e}
.comMeta{display:flex;justify-content:space-between;gap:5px;margin-top:5px;font-size:11px;opacity:.68}.recipeLabel{font-size:12px;font-weight:1000;margin-top:4px}
.myHeader{display:flex;justify-content:space-between;align-items:end;gap:8px}.myRecipeName{font-size:18px;font-weight:1000}
.counterActionRow{display:flex;justify-content:flex-end;margin-top:6px}.counterAction{border:0;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:1000;background:#ddd6d1;color:#fff;box-shadow:none;transition:.18s;min-width:118px}.counterAction.ready{background:linear-gradient(135deg,#82d69a,#58bf7d);box-shadow:0 4px 11px #65c98944}.counterAction.selectedReady{transform:translateY(-1px);box-shadow:0 5px 13px #65c98966}
.handTitle{font-size:12px;font-weight:1000;margin:8px 0 5px;opacity:.65}.hand{display:flex;justify-content:center;align-items:flex-end;overflow:visible;padding:7px 18px 8px;min-height:104px;touch-action:none}
.handCard{flex:0 0 72px;border:2px solid #e4d8cf;border-radius:13px;background:#fff;min-height:90px;padding:5px 3px;font-size:11px;font-weight:900;touch-action:none;position:relative;transition:transform .12s,border-color .12s,box-shadow .12s;z-index:1}
.handCard+.handCard{margin-left:-15px}.handCard.need::after{content:"★";position:absolute;right:3px;top:1px;font-size:16px}.handCard.canDiscard{border-color:#ffad63}.handCard.selected{transform:translateY(-10px);z-index:8;border-color:#ff8fa9;box-shadow:0 7px 16px #0002}.handCard.needNow.selected{border-color:#58bf7d;box-shadow:0 0 0 3px #9bdc9b66,0 7px 16px #0002}.handCard.dragging{opacity:.22}
.dropReady{box-shadow:0 0 0 4px #6fca8d66!important}.discard.dropReady{border-color:#ff9f62;background:#fff4e8}.counter.dropReady{border-radius:12px;background:#f2fff4}
.piles{display:flex;justify-content:center;gap:8px;align-items:center}.pile{width:88px;height:104px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:1000}
.deck{border:0;background:repeating-linear-gradient(45deg,#ffd991,#ffd991 9px,#ffecbe 9px,#ffecbe 18px)}.discard{background:#fff;border:2px solid #e5d9d1;padding:7px;text-align:center}
.recipeBtn{border:0;font-size:17px;font-weight:1000;background:#ff9db4;color:#fff;box-shadow:0 4px 12px #ff9db455;transition:.18s}.recipeBtn.ready{animation:recipePulse .8s ease-in-out infinite alternate}.recipeBtn.easyDisabled{filter:grayscale(1);opacity:.42}.handCard.needNow{border-color:#7bc77b;box-shadow:0 0 0 3px #9bdc9b55}.motionCard{position:fixed;z-index:1000;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px solid #d9cec6;border-radius:12px;padding:4px;font-size:11px;font-weight:900;box-shadow:0 7px 18px #0003;transition:transform .32s ease-in-out,opacity .32s}.flash{animation:flash .35s ease-out}.placeFlash{animation:placeFlash .4s ease-out}@keyframes recipePulse{from{transform:scale(1)}to{transform:scale(1.05)}}@keyframes flash{50%{transform:scale(1.08);background:#fff1b8}}@keyframes placeFlash{50%{transform:scale(1.04);box-shadow:0 0 0 5px #9bdc9b55}}
.status{margin-top:8px;padding:8px;border-radius:13px;background:#fff;min-height:44px;font-weight:900;line-height:1.4}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{width:min(420px,100%);background:#fff;border-radius:28px;padding:24px;text-align:center}.modal .big{font-size:70px}.modal h2{font-size:28px;margin:5px}.modal button{border:0;border-radius:15px;padding:12px 15px;font-weight:1000;background:#ffd39c}
@media(max-width:560px){.slot .cardface{font-size:9px}.handCard{flex-basis:66px}.handCard+.handCard{margin-left:-17px}.hand{padding-left:10px;padding-right:10px}.recipePick{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="back" onclick="location.href='index.html'">← もどる</button><h1>🍳 レシピたいせん</h1></div>

  <section id="start" class="screen active">
    <div class="panel center">
      <div class="title">3にんで レシピたいせん！</div>
      <div class="sub">ねこさん・おねえさん・シェフ から、対戦相手がランダムで2人えらばれるよ</div>
      <div class="toggle"><b>かんたんモード</b><button id="easySwitch" class="switch on" onclick="toggleEasy()"><span></span></button><span id="easyText">ON</span></div>
      <div class="sub">ON：必要な手札に★。取れないときの「レシピ！」はグレーになります。</div>
      <br><button class="bigbtn" onclick="showRecipePick()">ゲームスタート</button>
    </div>
  </section>

  <section id="pick" class="screen"><div class="panel center"><div class="title">レシピカードを 1まい えらんでね</div><div class="sub">6まいとも うらむき</div><div id="recipePick" class="recipePick"></div></div></section>
  <section id="reveal" class="screen"><div class="panel center"><div class="title">あなたの レシピは…</div><div id="revealFood" class="reveal"></div><div id="revealName" class="title"></div><div id="revealNeeds" class="needList"></div><br><button class="bigbtn" onclick="startRoulette()">つぎへ</button></div></section>
  <section id="rouletteScreen" class="screen"><div class="panel center"><div class="title">さいしょは だれ？</div><div id="roulette" class="roulette">🎲</div><div id="rouletteName" class="title">ルーレット！</div><br><button id="rouletteBtn" class="bigbtn" onclick="spinRoulette()">まわす！</button></div></section>

  <section id="game" class="screen">
    <div class="board">
      <div id="seat1" class="seat leftSeat"></div>
      <div id="seat2" class="seat rightSeat"></div>
      <div class="table">
        <div id="turnText" class="title" style="font-size:18px"></div>
        <div class="piles">
          <button id="deckBtn" class="pile deck" onclick="humanDraw()">🂠<br>やまふだ<br><span id="deckCount"></span></button>
          <div id="discardPile" class="pile discard"><b>すてば</b></div>
          <button id="recipeBtn" class="pile recipeBtn" onclick="humanRecipe()">レシピ！</button>
        </div>
        <div id="status" class="status"></div>
      </div>
      <div id="seat0" class="seat youSeat"></div>
    </div>
  </section>
</div>

<div id="overlay" class="overlay"><div class="modal"><div id="resultEmoji" class="big"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button onclick="restart()">もういちど</button></div></div>

<script>
const ITEMS={
rice:"ごはん",onion:"たまねぎ",carrot:"にんじん",potato:"じゃがいも",meat:"おにく",curry:"カレールウ",
egg:"たまご",ketchup:"ケチャップ",chicken:"とりにく",butter:"バター",milk:"ぎゅうにゅう",cheese:"チーズ",
pasta:"パスタ",tomato:"トマト",mushroom:"きのこ",bacon:"ベーコン",bread:"パン",lettuce:"レタス",
ham:"ハム",cucumber:"きゅうり",flour:"こむぎこ",sugar:"さとう",strawberry:"いちご",cream:"クリーム"
};
const RECIPES=[
{name:"カレー",emoji:"🍛",need:["rice","onion","carrot","potato","meat","curry"]},
{name:"オムライス",emoji:"🍳",need:["rice","egg","onion","chicken","ketchup","butter"]},
{name:"グラタン",emoji:"🧀",need:["milk","cheese","onion","mushroom","butter","flour"]},
{name:"ナポリタン",emoji:"🍝",need:["pasta","tomato","onion","mushroom","bacon","ketchup"]},
{name:"サンドイッチ",emoji:"🥪",need:["bread","lettuce","ham","cucumber","egg","cheese"]},
{name:"いちごケーキ",emoji:"🍰",need:["flour","egg","milk","sugar","strawberry","cream"]}
];
const USER={name:"あなた",avatar:"🙂",human:true,skill:1};
const COMS=[
{name:"ねこさん",avatar:"🐱",human:false,skill:.58},
{name:"おねえさん",avatar:"👩",human:false,skill:.84},
{name:"シェフ",avatar:"👨‍🍳",human:false,skill:.97}
];

let easy=true,players=[],deck=[],discard=[],turn=0,phase="idle",pending=null,gameOver=false,dragIndex=null,selectedIndex=null,dragState=null;
let audioCtx=null;
function audio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function beep(type){
  const a=audio(),now=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);
  const cfg={
    discard:[180,.045,"square"],draw:[520,.08,"sine"],place:[260,.07,"triangle"],
    recipe:[760,.12,"sine"],error:[130,.09,"square"],turn:[420,.04,"sine"],win:[660,.12,"sine"]
  }[type]||[300,.05,"sine"];
  o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);
  if(type==="draw")o.frequency.exponentialRampToValueAtTime(800,now+cfg[1]);
  if(type==="recipe")o.frequency.setValueAtTime(980,now+.07);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.11,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+cfg[1]);
  o.start(now);o.stop(now+cfg[1]+.02);
  if(type==="win")setTimeout(()=>{beep("recipe")},120);
}
function rectCenter(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}}
function flyCard(label,fromEl,toEl,done){
  if(!fromEl||!toEl){done?.();return}
  const a=rectCenter(fromEl),b=rectCenter(toEl);
  const ghost=document.createElement("div");ghost.className="motionCard";ghost.textContent=label;
  ghost.style.width=Math.max(52,Math.min(72,a.w||64))+"px";ghost.style.height=Math.max(64,Math.min(88,a.h||80))+"px";
  ghost.style.left=(a.x-32)+"px";ghost.style.top=(a.y-38)+"px";
  document.body.appendChild(ghost);
  requestAnimationFrame(()=>{ghost.style.transform="translate("+(b.x-a.x)+"px,"+(b.y-a.y)+"px) scale(.92)";ghost.style.opacity=".78"});
  setTimeout(()=>{ghost.remove();done?.()},340);
}
function flashEl(el,cls="flash"){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),450)}


function $(id){return document.getElementById(id)}
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function toggleEasy(){easy=!easy;$("easySwitch").classList.toggle("on",easy);$("easyText").textContent=easy?"ON":"OFF";if($("game").classList.contains("active"))render()}

function showRecipePick(){
  const b=$("recipePick");b.innerHTML="";
  for(let i=0;i<6;i++)b.innerHTML+='<button class="faceDown" onclick="chooseRecipe('+i+')">🍽️</button>';
  show("pick")
}

function chooseRecipe(i){
  const shuffledRecipes=shuffle([...RECIPES]),mine=shuffledRecipes[i],rest=shuffledRecipes.filter((_,x)=>x!==i);
  const opponents=shuffle([...COMS]).slice(0,2);
  players=[USER,...opponents].map((p,idx)=>({...p,id:idx,recipe:null,hand:[],placed:[]}));
  players[0].recipe=mine;players[1].recipe=rest[0];players[2].recipe=rest[1];
  $("revealFood").textContent=mine.emoji;$("revealName").textContent=mine.name;
  $("revealNeeds").innerHTML=mine.need.map(k=>'<span class="needChip">'+ITEMS[k]+'</span>').join("");
  show("reveal")
}

function startRoulette(){buildDeck();show("rouletteScreen");$("roulette").textContent="🎲";$("rouletteName").textContent="ルーレット！";$("rouletteBtn").disabled=false}
function buildDeck(){
  let a=[];Object.keys(ITEMS).forEach(k=>a.push(k,k,k,k));deck=shuffle(a);discard=[];gameOver=false;
  players.forEach(p=>{p.hand=[];p.placed=[];for(let i=0;i<6;i++)p.hand.push(deck.pop())})
}
function spinRoulette(){
  $("rouletteBtn").disabled=true;let t=0;
  const tm=setInterval(()=>{
    const p=players[t%players.length];$("roulette").textContent=p.avatar;$("rouletteName").textContent=p.name;t++;
    if(t>16+rand(8)){
      clearInterval(tm);turn=rand(players.length);const p=players[turn];
      $("roulette").textContent=p.avatar;$("rouletteName").textContent=p.name+" から スタート！";
      setTimeout(()=>{show("game");startTurn()},800)
    }
  },85)
}
function startTurn(){
  if(gameOver)return;selectedIndex=null;phase="discard";const p=players[turn];beep("turn");
  setStatus(p.human?"てふだから 1まい すててね。":p.name+" の ばん！");render();
  if(!p.human)setTimeout(comDiscard,1300+rand(900))
}

function render(){
  players.forEach((p,i)=>renderSeat(p,i));
  const d=discard.at(-1);
  $("discardPile").innerHTML=d?'<b>'+ITEMS[d]+'</b><small>すてば</small>':'<b>すてば</b>';
  $("deckCount").textContent=deck.length+"まい";
  $("turnText").textContent=players[turn].avatar+" "+players[turn].name+" の ばん";
  $("deckBtn").disabled=!(turn===0&&phase==="draw");
  const canRecipe=!!(pending&&pending.from!==0&&canUse(players[0],pending.card));
  $("recipeBtn").classList.toggle("easyDisabled",easy&&!canRecipe);$("recipeBtn").classList.toggle("ready",canRecipe);
}

function renderSeat(p,i){
  const el=$("seat"+i);el.classList.toggle("active",i===turn);
  const counter=counterHTML(p,i===0);
  let body='<div class="who"><span class="avatar">'+p.avatar+'</span>'+p.name+'</div>';
  if(i===0){
    const canPlaceNow=turn===0&&phase==="discard"&&p.hand.some(k=>canUse(p,k));
    const selectedCanPlace=selectedIndex!==null&&p.hand[selectedIndex]&&canUse(p,p.hand[selectedIndex]);
    body+='<div class="myHeader"><div class="myRecipeName">'+p.recipe.emoji+" "+p.recipe.name+'</div><div>'+p.placed.length+'/6</div></div>'+counter+
      '<div class="counterActionRow"><button class="counterAction '+(canPlaceNow?"ready ":"")+(canPlaceNow&&selectedCanPlace?"selectedReady":"")+'" onclick="placeSelectedToCounter()">カウンターに出す</button></div>'+
      '<div class="handTitle">てふだ '+p.hand.length+'まい　<span style="font-weight:600">（タップで選択／ドラッグで移動）</span></div><div class="hand" id="myHand">'+
      p.hand.map((k,idx)=>handCardHTML(k,idx)).join("")+'</div>';
  }else{
    body+='<div class="recipeLabel">キッチンカウンター '+p.placed.length+'/6</div>'+counter+
      '<div class="comMeta"><span>てふだ '+p.hand.length+'まい</span><span>レシピは ひみつ</span></div>';
  }
  el.innerHTML=body;if(i===0)bindDrag()
}

function counterHTML(p,isMe){
  return '<div class="counter">'+p.recipe.need.map(k=>{
    const x=p.placed.find(q=>q.card===k);
    if(!x){
      if(isMe)return '<div class="slot preview" data-key="'+k+'"><div class="cardface">'+ITEMS[k]+'</div><div class="veil"></div></div>';
      return '<div class="slot empty"></div>';
    }
    if(x.public)return '<div class="slot public" data-key="'+k+'"><div class="cardface">'+ITEMS[k]+'</div></div>';
    if(isMe)return '<div class="slot self-hidden" data-key="'+k+'"><div class="cardface">'+ITEMS[k]+'</div><div class="veil"></div></div>';
    return '<div class="slot self-hidden" data-key="'+k+'"><div class="cardface"></div><div class="veil"></div></div>';
  }).join("")+'</div>'
}

function handCardHTML(k,i){
  const need=easy&&canUse(players[0],k);
  const sel=selectedIndex===i;
  return '<button class="handCard '+(need?"need ":"")+(turn===0&&phase==="discard"?"canDiscard ":"")+(turn===0&&phase==="discard"&&canUse(players[0],k)?"needNow ":"")+(sel?"selected":"")+'" data-i="'+i+'">'+ITEMS[k]+'</button>'
}

function clearDropHints(){
  document.querySelectorAll(".dropReady").forEach(x=>x.classList.remove("dropReady"));
}
function bindDrag(){
  const cards=[...document.querySelectorAll("#myHand .handCard")];
  cards.forEach(c=>{
    c.addEventListener("pointerdown",e=>{
      if(gameOver)return;
      dragIndex=+c.dataset.i;
      dragState={id:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,ghost:null};
      c.setPointerCapture?.(e.pointerId);
    });
    c.addEventListener("pointermove",e=>{
      if(!dragState||dragState.id!==e.pointerId||dragIndex===null)return;
      const dx=e.clientX-dragState.startX,dy=e.clientY-dragState.startY;
      if(!dragState.moved&&Math.hypot(dx,dy)<9)return;
      if(!dragState.moved){
        dragState.moved=true;c.classList.add("dragging");
        const ghost=c.cloneNode(true);ghost.classList.remove("dragging","selected");ghost.classList.add("motionCard");
        const r=c.getBoundingClientRect();ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";ghost.style.left=(e.clientX-r.width/2)+"px";ghost.style.top=(e.clientY-r.height/2)+"px";ghost.style.transition="none";
        document.body.appendChild(ghost);dragState.ghost=ghost;
      }
      e.preventDefault();
      const g=dragState.ghost,r=g.getBoundingClientRect();g.style.left=(e.clientX-r.width/2)+"px";g.style.top=(e.clientY-r.height/2)+"px";
      clearDropHints();
      const under=document.elementFromPoint(e.clientX,e.clientY);
      const card=players[0].hand[dragIndex];
      if(under?.closest("#discardPile")&&turn===0&&phase==="discard")$("discardPile").classList.add("dropReady");
      if(under?.closest("#seat0 .counter")&&turn===0&&phase==="discard"&&canUse(players[0],card))document.querySelector("#seat0 .counter")?.classList.add("dropReady");
    });
    c.addEventListener("pointerup",e=>{
      if(!dragState||dragState.id!==e.pointerId)return;
      const wasMoved=dragState.moved,idx=dragIndex;
      dragState.ghost?.remove();c.classList.remove("dragging");clearDropHints();
      const under=document.elementFromPoint(e.clientX,e.clientY);
      dragState=null;dragIndex=null;
      if(!wasMoved){humanCardTap(idx);return}
      if(turn===0&&phase==="discard"&&under?.closest("#discardPile")){selectedIndex=null;discardFrom(0,idx);return}
      if(turn===0&&phase==="discard"&&under?.closest("#seat0 .counter")){
        if(canUse(players[0],players[0].hand[idx])){selectedIndex=null;placeFromHand(idx);return}
        beep("error");setStatus("そのカードは カウンターに出せないよ。");render();return
      }
      const target=under?.closest("#myHand .handCard");
      if(target){
        const to=+target.dataset.i;
        if(to!==idx){
          const [m]=players[0].hand.splice(idx,1);players[0].hand.splice(to,0,m);
          selectedIndex=null;render();return
        }
      }
      render();
    });
    c.addEventListener("pointercancel",()=>{
      dragState?.ghost?.remove();dragState=null;dragIndex=null;clearDropHints();render()
    })
  })
}

function setStatus(t){$("status").textContent=t}
function canUse(p,k){return p.recipe.need.includes(k)&&!p.placed.some(x=>x.card===k)}
function humanCardTap(i){
  if(gameOver)return;
  selectedIndex=(selectedIndex===i?null:i);
  if(turn===0&&phase==="discard"){
    const card=players[0].hand[i];
    setStatus(canUse(players[0],card)?ITEMS[card]+" をえらんだよ。カウンターに出すか、すてばへドラッグしてね。":ITEMS[card]+" をえらんだよ。すてばへドラッグできるよ。");
  }
  render()
}
function placeSelectedToCounter(){
  if(turn!==0||phase!=="discard"||gameOver){beep("error");return}
  const p=players[0];
  if(selectedIndex===null||!p.hand[selectedIndex]||!canUse(p,p.hand[selectedIndex])){
    if(p.hand.some(k=>canUse(p,k)))setStatus("カウンターに出したいカードを 1まいえらんでね。");
    else setStatus("いま カウンターに出せるカードはないよ。");
    beep("error");render();return
  }
  const i=selectedIndex;selectedIndex=null;placeFromHand(i)
}
function placeFromHand(i){
  const p=players[0],card=p.hand[i];selectedIndex=null;
  if(!canUse(p,card))return;
  const from=document.querySelector('#myHand .handCard[data-i="'+i+'"]');
  const to=document.querySelector('#seat0 .slot[data-key="'+card+'"]');
  phase="animating";setStatus(ITEMS[card]+" を キッチンカウンターに おくよ。");
  flyCard(ITEMS[card],from,to,()=>{
    p.hand.splice(i,1);p.placed.push({card,public:false});beep("place");render();
    flashEl(document.querySelector('#seat0 .slot[data-key="'+card+'"]'),"placeFlash");
    if(checkWin(0))return;
    phase="discard";setStatus("つぎに てふだから 1まい すててね。");render();
  })
}

function discardFrom(pid,i){
  if(pid===0)selectedIndex=null;

  // 前の人の捨て札への「レシピ！」は、この人が次の捨て札を選ぶ瞬間まで有効。
  // 新しい捨て札を出し始めた時点で、ひとつ前の権利だけを締め切る。
  pending=null;

  const p=players[pid],card=p.hand[i];
  const from=pid===0?document.querySelector('#myHand .handCard[data-i="'+i+'"]'):$("seat"+pid);
  const to=$("discardPile");
  phase="animating";setStatus(p.name+" が カードを すてます。");
  flyCard(ITEMS[card],from,to,()=>{
    p.hand.splice(i,1);discard.push(card);pending={from:pid,card};phase="claim";beep("discard");
    setStatus(p.name+" が "+ITEMS[card]+" を すてた！");render();flashEl($("discardPile"));
    setTimeout(()=>resolveClaims(pid,card),520)
  })
}

function resolveClaims(from,card){
  if(gameOver)return;
  const order=[];for(let s=1;s<players.length;s++)order.push((from+s)%players.length);
  phase="claim";render();

  const humanCanClaim=from!==0&&canUse(players[0],card);
  if(humanCanClaim)setStatus("「レシピ！」できるか すてふだを みてね。");

  // CPUも即決しない。少し考えてから判断する。
  // 人間のレシピ！は時間では締め切らない。次の人が自分の捨て札を選ぶまで pending を残す。
  setTimeout(()=>{
    if(gameOver||!pending||pending.from!==from||pending.card!==card)return;
    for(const id of order){
      if(id===0)continue;
      const p=players[id];
      if(canUse(p,card)&&Math.random()<p.skill){takeDiscard(id,card,from);return}
    }
    finishClaimWindow(from)
  },950+rand(650))
}

function humanRecipe(){
  const canClaim=!!(pending&&pending.from!==0&&canUse(players[0],pending.card));
  if(easy&&!canClaim){beep("error");return;}
  if(!pending||pending.from===0){beep("error");setStatus("いまは とれないよ！");return}
  const card=pending.card;
  if(!canUse(players[0],card)){beep("error");setStatus("これは とれないよ！");return}
  takeDiscard(0,card,pending.from)
}

function takeDiscard(pid,card,from){
  const fromEl=$("discardPile"),toEl=$("seat"+pid);
  phase="animating";setStatus("「レシピ！」 "+players[pid].name+"！");
  beep("recipe");
  flyCard(ITEMS[card],fromEl,toEl,()=>{
    if(discard.at(-1)===card)discard.pop();
    players[pid].placed.push({card,public:true});pending=null;
    setStatus("「レシピ！」 "+players[pid].name+" が "+ITEMS[card]+" を とった！");
    render();flashEl($("seat"+pid),"placeFlash");
    if(checkWin(pid))return;
    setTimeout(()=>finishClaimWindow(from),700)
  })
}

function finishClaimWindow(from){
  turn=from;phase="draw";const p=players[turn];
  setStatus(p.human?"やまふだから 1まい ひいてね。":p.name+" が やまふだから ひきます。");render();
  if(!p.human)setTimeout(()=>drawFor(turn),900+rand(650))
}

function humanDraw(){if(turn===0&&phase==="draw")drawFor(0)}
function drawFor(pid){
  if(deck.length===0)refillDeck();if(deck.length===0)return;
  const p=players[pid],card=deck[deck.length-1],fromEl=$("deckBtn"),toEl=$("seat"+pid);
  phase="animating";setStatus(p.name+" が やまふだから ひきます。");beep("draw");
  flyCard(pid===0?ITEMS[card]:"カード",fromEl,toEl,()=>{
    deck.pop();
    if(canUse(p,card)){
      p.placed.push({card,public:false});beep("place");
      setStatus(p.name+" は ひいたカードを キッチンカウンターに おいた。");
    }else{
      p.hand.push(card);setStatus(p.human?ITEMS[card]+" を ひいた。":p.name+" は カードを ひいた。")
    }
    render();flashEl($("seat"+pid),"placeFlash");
    if(checkWin(pid))return;
    setTimeout(nextTurn,900+rand(650))
  })
}

function comDiscard(){
  const p=players[turn];let choices=p.hand.map((k,i)=>({k,i}));
  let bad=choices.filter(x=>!canUse(p,x.k));if(!bad.length)bad=choices;
  if(p.name==="シェフ"){
    const safe=bad.filter(x=>!players.some((o,j)=>j!==p.id&&canUse(o,x.k)));
    if(safe.length)bad=safe
  }
  discardFrom(turn,bad[rand(bad.length)].i)
}
function nextTurn(){turn=(turn+1)%players.length;startTurn()}
function refillDeck(){if(discard.length>1){const top=discard.pop();deck=shuffle(discard.splice(0));discard=[top]}}
function checkWin(pid){
  const p=players[pid];if(p.placed.length<6)return false;gameOver=true;beep("win");
  $("resultEmoji").textContent=p.avatar+p.recipe.emoji;$("resultTitle").textContent="できあがり！";$("resultText").textContent=p.name+" が "+p.recipe.name+" を かんせい！";
  setTimeout(()=>$("overlay").classList.add("show"),300);return true
}
function restart(){$("overlay").classList.remove("show");show("start")}
</script>
