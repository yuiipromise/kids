<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>レシピたいせん</title>
<style>
:root{--ink:#3a302b;--paper:#fffdf9;--line:#e7d9cf;--pink:#ff9ab2;--orange:#ffbd72;--green:#9bd49b;--shadow:0 8px 24px #734d3520}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff7ea,#fff1f5)}
button{font:inherit}
.app{width:min(900px,100%);margin:auto;padding:10px 10px 28px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.back{border:0;border-radius:14px;background:#fff;padding:9px 12px;font-weight:900;box-shadow:0 3px 12px #0001}
h1{font-size:clamp(25px,7vw,38px);margin:0;flex:1;text-align:center}
.screen{display:none}.screen.active{display:block}
.panel{background:#ffffffeb;border-radius:25px;padding:18px;box-shadow:var(--shadow)}
.center{text-align:center}
.title{font-size:24px;font-weight:1000}
.sub{opacity:.7;line-height:1.6}
.toggle{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 8px;background:#fff7e7;border-radius:20px;padding:13px}
.switch{position:relative;width:58px;height:34px;background:#d9d1cc;border:0;border-radius:30px;padding:0}
.switch span{position:absolute;left:4px;top:4px;width:26px;height:26px;background:white;border-radius:50%;transition:.18s;box-shadow:0 2px 7px #0002}
.switch.on{background:#8fd08f}.switch.on span{left:28px}
.bigbtn{border:0;border-radius:18px;background:linear-gradient(135deg,#ffbe70,#ff91a8);color:white;padding:14px 24px;font-size:19px;font-weight:1000;box-shadow:0 6px 16px #ff9a8c55}
.recipePick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.faceDown{border:4px solid white;border-radius:22px;min-height:132px;background:repeating-linear-gradient(45deg,#ffc9d6,#ffc9d6 10px,#ffe3ea 10px,#ffe3ea 20px);box-shadow:0 6px 16px #0002;font-size:42px}
.faceDown:active{transform:scale(.97)}
.reveal{font-size:70px;margin:10px}.needList{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0}
.needChip{background:#fff3de;border:2px solid #f1d5aa;border-radius:14px;padding:6px 8px;font-weight:800;font-size:13px}
.roulette{font-size:82px;margin:18px 0 8px;min-height:100px;display:flex;align-items:center;justify-content:center}
.gameBoard{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-template-areas:"top top" "left right" "center center" "you you"}
.seat{background:#fff;border-radius:20px;padding:10px;box-shadow:var(--shadow);min-width:0}
.seat.top{grid-area:top}.seat.left{grid-area:left}.seat.right{grid-area:right}.seat.you{grid-area:you}
.centerTable{grid-area:center;background:#fff8ee;border-radius:22px;padding:11px;text-align:center;box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:7px;font-weight:1000}.avatar{font-size:28px}.turnmark{margin-left:auto;background:#ffdc75;border-radius:20px;padding:3px 8px;font-size:11px;display:none}.seat.activeTurn .turnmark{display:block}
.hiddenRecipe{margin-top:8px;background:#f5eee9;border-radius:15px;padding:9px;font-weight:1000}
.publicRecipe{margin-top:8px;background:#fff7e7;border-radius:15px;padding:9px}
.recipeName{font-size:18px;font-weight:1000}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}
.slot{min-height:45px;border:2px dashed #d8cbc2;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff}
.slot.got{border-style:solid;border-color:#9dcc9d;background:#edfaed}
.handCount{font-size:12px;opacity:.65;margin-top:7px}
.cardBacks{display:flex;gap:3px;overflow:hidden;margin-top:5px}.miniBack{width:22px;height:32px;flex:none;border-radius:6px;background:repeating-linear-gradient(45deg,#ffc6d5,#ffc6d5 5px,#ffe2e9 5px,#ffe2e9 10px);border:1px solid white}
.myRecipe{display:flex;gap:9px;align-items:center}.myRecipe .food{font-size:38px}
.myNeeds{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.myNeed{font-size:11px;background:#fff4e1;border-radius:9px;padding:4px 5px}.myNeed.done{background:#e8f8e8;text-decoration:line-through}
.myHand{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:9px}
.handCard{border:2px solid var(--line);border-radius:13px;background:#fff;min-height:66px;padding:5px 2px;font-size:10px;font-weight:900}.handCard .e{display:block;font-size:25px}.handCard.pick{border-color:#ff9d53;box-shadow:0 0 0 3px #ffbd7244}
.tableRow{display:flex;justify-content:center;gap:12px;align-items:center}
.pile{width:90px;height:108px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:1000}
.deck{border:0;background:repeating-linear-gradient(45deg,#ffd88f,#ffd88f 9px,#ffebb9 9px,#ffebb9 18px);color:#68491d}
.discard{background:white;border:2px solid var(--line)}.discard .e{font-size:34px}
.status{font-weight:1000;line-height:1.5;min-height:48px;padding:8px;margin-top:8px;background:#fff;border-radius:14px}
.actionRow{display:flex;gap:7px;margin-top:8px}.actionRow button{flex:1;border:0;border-radius:14px;padding:11px 5px;font-weight:1000}.green{background:#a9dca9}.gray{background:#e9e1dc}.orange{background:#ffd08f}
.history{margin-top:8px;display:flex;gap:6px;overflow-x:auto;min-height:0}.hist{white-space:nowrap;background:#edf9ed;border-radius:12px;padding:6px 8px;font-size:12px;font-weight:800}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}
.modal{width:min(430px,100%);background:white;border-radius:28px;padding:24px;text-align:center}.modal .big{font-size:70px}.modal h2{font-size:28px;margin:5px}.modal button{border:0;border-radius:15px;padding:12px 15px;margin:5px;font-weight:1000;background:#ffd59f}
@media(max-width:560px){.recipePick{grid-template-columns:repeat(2,1fr)}.gameBoard{gap:6px}.seat{padding:8px}.slots{gap:2px}.slot{min-height:38px;font-size:19px}.myHand{gap:3px}.handCard{min-height:61px}.handCard .e{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="back" onclick="location.href='index.html'">← もどる</button><h1>🍳 レシピたいせん</h1></div>

  <section id="start" class="screen active">
    <div class="panel center">
      <div class="title">4にんで レシピたいせん！</div>
      <div class="sub">あなた・ねこさん・おねえさん・シェフで あそぶよ</div>
      <div class="toggle">
        <b>かんたんモード</b>
        <button id="easySwitch" class="switch on" onclick="toggleEasy()"><span></span></button>
        <span id="easyText">ON</span>
      </div>
      <div class="sub">ON：だれかが すてばから ひろったカードを、しばらく表示します。</div>
      <br><button class="bigbtn" onclick="showRecipePick()">ゲームスタート</button>
    </div>
  </section>

  <section id="pick" class="screen">
    <div class="panel center">
      <div class="title">レシピカードを 1まい えらんでね</div>
      <div class="sub">6まいとも うらむき。どれにする？</div>
      <div id="recipePick" class="recipePick"></div>
    </div>
  </section>

  <section id="reveal" class="screen">
    <div class="panel center">
      <div class="title">あなたの レシピは…</div>
      <div id="revealFood" class="reveal"></div>
      <div id="revealName" class="title"></div>
      <div id="revealNeeds" class="needList"></div>
      <div class="sub">この6つを ぜんぶ そろえたら かんせい！</div>
      <br><button class="bigbtn" onclick="startRoulette()">つぎへ</button>
    </div>
  </section>

  <section id="rouletteScreen" class="screen">
    <div class="panel center">
      <div class="title">さいしょは だれ？</div>
      <div id="roulette" class="roulette">🎲</div>
      <div id="rouletteName" class="title">ルーレット！</div>
      <br><button id="rouletteBtn" class="bigbtn" onclick="spinRoulette()">まわす！</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="gameBoard">
      <div class="seat top" id="seat2"></div>
      <div class="seat left" id="seat1"></div>
      <div class="seat right" id="seat3"></div>

      <div class="centerTable">
        <div id="turnText" class="title" style="font-size:19px"></div>
        <div class="tableRow">
          <button id="deckBtn" class="pile deck" onclick="humanDraw()">🂠<br>やまふだ<br><span id="deckCount"></span></button>
          <div class="pile discard" id="discardPile"><span class="e">🍽️</span><small>すてば</small></div>
        </div>
        <div id="actions"></div>
        <div id="status" class="status"></div>
        <div id="history" class="history"></div>
      </div>

      <div class="seat you" id="seat0"></div>
    </div>
  </section>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <div id="resultEmoji" class="big"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <button onclick="restart()">もういちど</button>
  </div>
</div>

<script>
const ITEMS={
rice:["🍚","ごはん"],onion:["🧅","たまねぎ"],carrot:["🥕","にんじん"],potato:["🥔","じゃがいも"],meat:["🥩","おにく"],curry:["🟫","カレールウ"],
egg:["🥚","たまご"],ketchup:["🍅","ケチャップ"],chicken:["🍗","とりにく"],butter:["🧈","バター"],milk:["🥛","ぎゅうにゅう"],cheese:["🧀","チーズ"],
pasta:["🍝","パスタ"],tomato:["🍅","トマト"],mushroom:["🍄","きのこ"],bacon:["🥓","ベーコン"],bread:["🍞","パン"],lettuce:["🥬","レタス"],
ham:["🥓","ハム"],cucumber:["🥒","きゅうり"],flour:["🌾","こむぎこ"],sugar:["🧂","さとう"],strawberry:["🍓","いちご"],cream:["🍦","クリーム"]
};
const RECIPES=[
{name:"カレー",emoji:"🍛",need:["rice","onion","carrot","potato","meat","curry"]},
{name:"オムライス",emoji:"🍳",need:["rice","egg","onion","chicken","ketchup","butter"]},
{name:"グラタン",emoji:"🧀",need:["milk","cheese","onion","mushroom","butter","flour"]},
{name:"ナポリタン",emoji:"🍝",need:["pasta","tomato","onion","mushroom","bacon","ketchup"]},
{name:"サンドイッチ",emoji:"🥪",need:["bread","lettuce","ham","cucumber","egg","cheese"]},
{name:"いちごケーキ",emoji:"🍰",need:["flour","egg","milk","sugar","strawberry","cream"]}
];
const BASE_PLAYERS=[
{id:0,name:"あなた",avatar:"🙂",human:true,skill:1},
{id:1,name:"ねこさん",avatar:"🐱",human:false,skill:.60},
{id:2,name:"おねえさん",avatar:"👩",human:false,skill:.86},
{id:3,name:"シェフ",avatar:"👨‍🍳",human:false,skill:.98}
];
let easy=true,players=[],deck=[],discard=[],turn=0,roundNo=0,phase="idle",pendingDiscard=null,pickOrder=[],gameOver=false,history=[];
function $(id){return document.getElementById(id)}
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function toggleEasy(){easy=!easy;$("easySwitch").classList.toggle("on",easy);$("easyText").textContent=easy?"ON":"OFF"}
function showRecipePick(){
  const box=$("recipePick");box.innerHTML="";
  for(let i=0;i<6;i++)box.innerHTML+='<button class="faceDown" onclick="chooseRecipe('+i+')">🍽️</button>';
  show("pick");
}
function chooseRecipe(i){
  const shuffled=shuffle([...RECIPES]);
  const mine=shuffled[i];
  const rest=shuffled.filter((_,idx)=>idx!==i);
  players=BASE_PLAYERS.map(p=>({...p,recipe:null,got:[],hand:[]}));
  players[0].recipe=mine;
  players[1].recipe=rest[0];players[2].recipe=rest[1];players[3].recipe=rest[2];
  $("revealFood").textContent=mine.emoji;$("revealName").textContent=mine.name;
  $("revealNeeds").innerHTML=mine.need.map(k=>'<span class="needChip">'+ITEMS[k][0]+" "+ITEMS[k][1]+'</span>').join("");
  show("reveal");
}
function startRoulette(){
  buildDeckAndDeal();
  show("rouletteScreen");$("roulette").textContent="🎲";$("rouletteName").textContent="ルーレット！";$("rouletteBtn").disabled=false;
}
function buildDeckAndDeal(){
  let arr=[];Object.keys(ITEMS).forEach(k=>{arr.push(k,k,k,k)});
  deck=shuffle(arr);discard=[];history=[];gameOver=false;roundNo=0;
  players.forEach(p=>{p.hand=[];p.got=[];for(let i=0;i<6;i++)p.hand.push(deck.pop())});
}
function spinRoulette(){
  $("rouletteBtn").disabled=true;
  let ticks=0;
  const timer=setInterval(()=>{
    const p=players[ticks%4];$("roulette").textContent=p.avatar;$("rouletteName").textContent=p.name; ticks++;
    if(ticks>15+rand(8)){
      clearInterval(timer);turn=rand(4);
      const w=players[turn];$("roulette").textContent=w.avatar;$("rouletteName").textContent=w.name+" から スタート！";
      setTimeout(()=>{show("game");phase="discard";setStatus(w.human?"まず てふだから 1まい すててね。":w.name+" の ばん！");render();if(!w.human)setTimeout(comDiscard,700)},900);
    }
  },90);
}
function render(){
  players.forEach((p,i)=>renderSeat(p,i));
  const d=discard.at(-1);
  $("discardPile").innerHTML=d?'<span class="e">'+ITEMS[d][0]+'</span><small>'+ITEMS[d][1]+'</small>':'<span class="e">🍽️</span><small>すてば</small>';
  $("deckCount").textContent=deck.length+"まい";
  $("deckBtn").disabled=!(players[turn].human&&phase==="draw"&&!gameOver);
  $("turnText").textContent=players[turn].avatar+" "+players[turn].name+" の ばん";
  $("history").innerHTML=easy?history.map(h=>'<div class="hist">'+h+'</div>').join(""):"";
}
function renderSeat(p,i){
  const el=$("seat"+i);el.classList.toggle("activeTurn",i===turn);
  let recipeHtml="";
  if(p.human){
    recipeHtml='<div class="publicRecipe"><div class="myRecipe"><div class="food">'+p.recipe.emoji+'</div><div><div class="recipeName">'+p.recipe.name+'</div><div>'+p.got.length+'/6 こ</div></div></div><div class="myNeeds">'+p.recipe.need.map(k=>'<span class="myNeed '+(p.got.includes(k)?"done":"")+'">'+ITEMS[k][0]+" "+ITEMS[k][1]+'</span>').join("")+'</div></div>';
  }else{
    recipeHtml='<div class="hiddenRecipe">🍽️ レシピは ひみつ　'+p.got.length+'/6</div><div class="slots">'+p.recipe.need.map(k=>p.got.includes(k)?'<div class="slot got">'+ITEMS[k][0]+'</div>':'<div class="slot">❓</div>').join("")+'</div>';
  }
  let handHtml="";
  if(p.human){
    handHtml='<div class="handCount">てふだ 6まい</div><div class="myHand">'+p.hand.map((k,idx)=>'<button class="handCard '+(phase==="discard"&&turn===0?"pick":"")+'" onclick="humanDiscard('+idx+')"><span class="e">'+ITEMS[k][0]+'</span>'+ITEMS[k][1]+'</button>').join("")+'</div>';
  }else{
    handHtml='<div class="handCount">てふだ '+p.hand.length+'まい</div><div class="cardBacks">'+p.hand.map(()=>'<div class="miniBack"></div>').join("")+'</div>';
  }
  el.innerHTML='<div class="who"><span class="avatar">'+p.avatar+'</span>'+p.name+'<span class="turnmark">ばん</span></div>'+recipeHtml+handHtml;
}
function setStatus(t){$("status").textContent=t}
function humanDiscard(idx){
  if(turn!==0||phase!=="discard"||gameOver)return;
  discardFrom(0,idx);
}
function discardFrom(pid,idx){
  const p=players[pid],card=p.hand.splice(idx,1)[0];discard.push(card);
  pendingDiscard={from:pid,card};
  setStatus(p.name+" が "+ITEMS[card][0]+" "+ITEMS[card][1]+" を すてた！");
  render();
  setTimeout(()=>resolveClaims(pid,card),450);
}
function resolveClaims(from,card){
  const candidates=[];
  for(let step=1;step<4;step++){
    const id=(from+step)%4,p=players[id];
    if(p.recipe.need.includes(card)&&!p.got.includes(card))candidates.push(id);
  }
  if(!candidates.length){afterClaimPhase(from);return}
  if(candidates.includes(0)){
    phase="claimChoice";
    $("actions").innerHTML='<div class="actionRow"><button class="green" onclick="humanClaim()">レシピ！ '+ITEMS[card][0]+'を もらう</button><button class="gray" onclick="humanPass()">いらない</button></div>';
    render();return;
  }
  comClaimOrPass(candidates,from,card);
}
function humanClaim(){
  if(phase!=="claimChoice")return;
  $("actions").innerHTML="";
  claimCard(0,pendingDiscard.card,pendingDiscard.from);
}
function humanPass(){
  $("actions").innerHTML="";
  const c=pendingDiscard;phase="waiting";const candidates=[];
  for(let step=1;step<4;step++){const id=(c.from+step)%4;if(id!==0){const p=players[id];if(p.recipe.need.includes(c.card)&&!p.got.includes(c.card))candidates.push(id)}}
  if(candidates.length)comClaimOrPass(candidates,c.from,c.card);else afterClaimPhase(c.from);
}
function comClaimOrPass(candidates,from,card){
  let claimant=null;
  for(const id of candidates){if(Math.random()<players[id].skill){claimant=id;break}}
  if(claimant!==null)claimCard(claimant,card,from);else afterClaimPhase(from);
}
function claimCard(pid,card,from){
  if(discard.at(-1)===card)discard.pop();
  const p=players[pid];p.got.push(card);
  if(easy)history.push(p.avatar+" "+p.name+"： "+ITEMS[card][0]+" "+ITEMS[card][1]+"を ひろった");
  setStatus("「レシピ！」 "+p.name+" が "+ITEMS[card][1]+" を ひろった！");
  if(checkWin(pid))return;
  // 拾った人は手札から1枚捨てて6枚を維持
  setTimeout(()=>{
    if(p.human){
      turn=0;phase="discardAfterClaim";setStatus("ひろったので、てふだから 1まい すててね。");renderClaimDiscard();
    }else{
      const idx=chooseDiscardIndex(p);const tossed=p.hand.splice(idx,1)[0];discard.push(tossed);
      setStatus(p.name+" は "+ITEMS[tossed][1]+" を 1まい すてた。");
      render();setTimeout(()=>afterClaimPhase(from),450);
    }
  },500);
}
function renderClaimDiscard(){
  phase="discard";
  render();
  // 次の通常ドローをさせないため特別フラグ
  phase="discardAfterClaim";
  const p=players[0];
  $("seat0").innerHTML=$("seat0").innerHTML.replaceAll('onclick="humanDiscard(','onclick="humanDiscardAfterClaim(');
}
function humanDiscardAfterClaim(idx){
  if(phase!=="discardAfterClaim")return;
  const card=players[0].hand.splice(idx,1)[0];discard.push(card);phase="waiting";
  setStatus("あなたは "+ITEMS[card][1]+" を すてた。");
  render();setTimeout(()=>afterClaimPhase(pendingDiscard.from),400);
}
function afterClaimPhase(originalFrom){
  pendingDiscard=null;$("actions").innerHTML="";
  // 元の手番の人が山札を引く
  turn=originalFrom;phase="draw";
  const p=players[turn];
  setStatus(p.human?"つぎに やまふだから 1まい ひいてね。":p.name+" が やまふだから ひきます。");
  render();
  if(!p.human)setTimeout(comDraw,650);
}
function humanDraw(){
  if(turn!==0||phase!=="draw"||gameOver)return;
  drawFor(0);
}
function drawFor(pid){
  if(deck.length===0)refillDeck();
  if(deck.length===0)return;
  const p=players[pid],card=deck.pop();
  p.hand.push(card);
  setStatus(p.name+" は "+ITEMS[card][0]+" "+ITEMS[card][1]+" を ひいた！");
  // 引いたカードが必要なら自動でレシピへ、手札は不足分を後で補充
  if(p.recipe.need.includes(card)&&!p.got.includes(card)){
    p.hand.pop();p.got.push(card);
    setStatus(p.name+" は "+ITEMS[card][1]+" を ひいて、レシピに おいた！");
    if(checkWin(pid)){render();return}
    // 手札を6枚に戻すため補充
    if(deck.length) p.hand.push(deck.pop());
  }
  render();setTimeout(nextTurn,550);
}
function comDiscard(){
  if(gameOver||players[turn].human||phase!=="discard")return;
  const idx=chooseDiscardIndex(players[turn]);discardFrom(turn,idx);
}
function chooseDiscardIndex(p){
  const bad=p.hand.map((k,i)=>({k,i})).filter(x=>!p.recipe.need.includes(x.k)||p.got.includes(x.k));
  if(bad.length){
    if(p.name==="シェフ"){
      const safe=bad.filter(x=>!players.some((op,j)=>j!==p.id&&op.recipe.need.includes(x.k)&&!op.got.includes(x.k)));
      if(safe.length)return safe[rand(safe.length)].i;
    }
    return bad[rand(bad.length)].i;
  }
  return rand(p.hand.length);
}
function comDraw(){drawFor(turn)}
function nextTurn(){
  if(gameOver)return;
  turn=(turn+1)%4;if(turn===0){roundNo++;if(easy)history=[]}
  phase="discard";
  const p=players[turn];
  setStatus(p.human?"あなたの ばん！ てふだから 1まい すててね。":p.name+" の ばん！");
  render();
  if(!p.human)setTimeout(comDiscard,650);
}
function refillDeck(){
  if(discard.length>1){const top=discard.pop();deck=shuffle(discard.splice(0));discard=[top]}
}
function checkWin(pid){
  const p=players[pid];if(p.got.length<6)return false;
  gameOver=true;
  $("resultEmoji").textContent=p.avatar+p.recipe.emoji;
  $("resultTitle").textContent=p.human?"できあがり！":"完成！";
  $("resultText").textContent=p.name+" が "+p.recipe.name+" を かんせい！";
  setTimeout(()=>$("overlay").classList.add("show"),350);return true;
}
function restart(){$("overlay").classList.remove("show");show("start")}
</script>
</body>
