<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>へんなぶんルーレット</title>
  <style>
    :root{
      --bg:#fffaf5; --card:#ffffff; --text:#2b2b2b; --muted:#6f6f6f;
      --accent:#ff8fb1; --accent2:#ffd66e; --accent3:#9fd8ff;
      --line:#eadfd8; --shadow:0 8px 24px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#fff7fb 0%,#fffdf8 100%);color:var(--text);min-height:100vh}
    main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
    h1{font-size:clamp(28px,7vw,44px);text-align:center;margin:8px 0 4px}
    .sub{color:var(--muted);text-align:center;font-size:14px;margin-bottom:18px}
    .roulette-grid{display:grid;gap:12px}
    .slot{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
    .slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    .label{font-weight:800;font-size:18px}
    .value{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:16px;background:#fffdf7;border:2px dashed #ead9c9;font-size:clamp(22px,6vw,32px);font-weight:800;padding:10px 12px}
    button{appearance:none;border:0;border-radius:16px;padding:12px 16px;font-size:18px;font-weight:800;cursor:pointer;touch-action:manipulation}
    .spin-btn{background:var(--accent2);color:#4a3a00;min-width:110px}
    .spin-btn.done{background:#dff4df;color:#265226}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .primary{background:var(--accent);color:white}
    .secondary{background:var(--accent3);color:#12415f}
    .ghost{background:white;border:2px solid var(--line);color:var(--text)}
    .sentence-card{margin-top:18px;background:white;border:3px solid #ffd3e0;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
    .sentence-title{font-weight:900;font-size:18px;margin-bottom:10px;text-align:center}
    .sentence{font-size:clamp(24px,6vw,34px);line-height:1.6;text-align:center;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}
    .mini{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
    .confetti{animation:pop .35s ease}
    @keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
    @media (min-width:620px){.actions{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
<main>
  <h1>🎰 へんなぶんルーレット</h1>
  <div class="sub">ぜんぶ とめたら、へんな ぶんが できるよ！</div>
  <div id="slots" class="roulette-grid"></div>
  <div class="actions">
    <button class="primary" id="autoBtn">✨ ぜんぶおまかせ</button>
    <button class="secondary" id="readBtn">🔊 よみあげる</button>
    <button class="ghost" id="resetBtn">🔄 もういっかい</button>
  </div>
  <section class="sentence-card" id="sentenceCard">
    <div class="sentence-title">できた ぶん</div>
    <div class="sentence" id="sentence">ルーレットを とめてね！</div>
    <div class="mini">※ よみあげは スマホやブラウザの おんせいを つかいます</div>
  </section>
</main>
<script>
const categories = [
  {key:'who',label:'だれが？',emoji:'👤',items:['ママが','パパが','ぼくが','わたしが','せんせいが','こうちょうせんせいが','おともだちが','あかちゃんが','ねこが','いぬが','きょうりゅうが','ペンギンが','ゴリラが','おばけが','うちゅうじんが','サンタさんが']},
  {key:'when',label:'いつ？',emoji:'🕒',items:['きょう','きのう','あした','あさ','ひる','まよなか','100ねんまえ','100ねんご','クリスマスに','おしょうがつに','たんじょうびに','ねるまえに','ごはんのまえに','がっこうがおわったあと']},
  {key:'where',label:'どこで？',emoji:'📍',items:['がっこうで','こうえんで','おうちで','トイレで','おふろで','れいぞうこのなかで','うちゅうで','つきのうえで','ジャングルで','きょうしつで','スーパーで','でんしゃのなかで','ベッドのうえで','プールで','きょうりゅうのせなかで']},
  {key:'what',label:'なにをした？',emoji:'🎬',items:['おどりました','ねました','カレーをつくりました','うたいました','さけびました','おにごっこをしました','ケーキをたべました','ダンスをしました','ほんをよみました','ころびました','ジャンプしました','おならをしました','ラーメンをつくりました','かくれんぼをしました','ピアノをひきました','えをかきました']},
  {key:'feeling',label:'どんなきもち？',emoji:'💭',items:['とてもたのしかったです','びっくりしました','うれしかったです','ちょっとかなしかったです','どきどきしました','くやしかったです','おもしろかったです','ふしぎだなとおもいました','またやりたいとおもいました','なんで！？とおもいました']}
];
const state=Object.fromEntries(categories.map(c=>[c.key,null]));
const slotsEl=document.getElementById('slots'),sentenceEl=document.getElementById('sentence'),sentenceCard=document.getElementById('sentenceCard'),autoBtn=document.getElementById('autoBtn'),readBtn=document.getElementById('readBtn'),resetBtn=document.getElementById('resetBtn');
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function renderSlots(){slotsEl.innerHTML='';categories.forEach(c=>{const slot=document.createElement('section');slot.className='slot';slot.innerHTML=`
<div class="slot-head"><div class="label">${c.emoji} ${c.label}</div><button class="spin-btn" data-key="${c.key}">ルーレット！</button></div>
<div class="value" id="value-${c.key}">？？？</div>`;slotsEl.appendChild(slot)});document.querySelectorAll('.spin-btn').forEach(btn=>btn.addEventListener('click',()=>spin(btn.dataset.key,btn)))}
function spin(key,btn){const c=categories.find(x=>x.key===key),valueEl=document.getElementById(`value-${key}`);let n=0;btn.disabled=true;btn.textContent='まわってる…';const timer=setInterval(()=>{valueEl.textContent=pick(c.items);n++;if(n>=12){clearInterval(timer);const final=pick(c.items);state[key]=final;valueEl.textContent=final;btn.disabled=false;btn.textContent='もういっかい';btn.classList.add('done');updateSentence()}},70)}
function updateSentence(){const ready=categories.every(c=>state[c.key]);if(!ready){const count=categories.filter(c=>state[c.key]).length;sentenceEl.textContent=`あと ${categories.length-count}こ とめてね！`;return}const text=`${state.when}、${state.who}${state.where}${state.what}。${state.feeling}。`;sentenceEl.textContent=text;sentenceCard.classList.remove('confetti');void sentenceCard.offsetWidth;sentenceCard.classList.add('confetti');speak(text)}
function speak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.9;u.pitch=1.05;const voices=window.speechSynthesis.getVoices();const ja=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));if(ja)u.voice=ja;window.speechSynthesis.speak(u)}
async function spinAll(){autoBtn.disabled=true;for(const c of categories){const btn=[...document.querySelectorAll('.spin-btn')].find(b=>b.dataset.key===c.key);await new Promise(resolve=>{const valueEl=document.getElementById(`value-${c.key}`);let n=0;btn.disabled=true;btn.textContent='まわってる…';const timer=setInterval(()=>{valueEl.textContent=pick(c.items);n++;if(n>=10){clearInterval(timer);const final=pick(c.items);state[c.key]=final;valueEl.textContent=final;btn.disabled=false;btn.textContent='もういっかい';btn.classList.add('done');resolve()}},55)})}updateSentence();autoBtn.disabled=false}
function reset(){categories.forEach(c=>state[c.key]=null);renderSlots();sentenceEl.textContent='ルーレットを とめてね！';if('speechSynthesis'in window)window.speechSynthesis.cancel()}
autoBtn.addEventListener('click',spinAll);readBtn.addEventListener('click',()=>{if(categories.every(c=>state[c.key]))speak(sentenceEl.textContent)});resetBtn.addEventListener('click',reset);renderSlots();
</script>
</body>
</html>
