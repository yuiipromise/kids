<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おうちゲーム</title>
<style>
:root{--bg1:#fff7e8;--bg2:#eef8ff;--text:#222}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:min(680px,100%)}
h1{text-align:center;font-size:clamp(30px,9vw,48px);margin:0 0 10px}
.lead{text-align:center;font-size:16px;opacity:.7;margin-bottom:22px}
.games{display:grid;gap:16px}
a.game{display:block;text-decoration:none;color:inherit;background:#ffffffee;border-radius:28px;padding:26px 22px;box-shadow:0 10px 26px #0002;touch-action:manipulation}
.icon{font-size:54px;line-height:1;margin-bottom:12px}
.title{font-size:28px;font-weight:900;margin-bottom:8px}
.desc{font-size:16px;line-height:1.5;opacity:.72}
.arrow{font-size:22px;font-weight:800;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <h1>🎮 おうちゲーム</h1>
  <div class="lead">あそびたいゲームを えらんでね！</div>

  <div class="games">
    <a class="game" href="gesture-game.html">
      <div class="icon">🎭</div>
      <div class="title">ジェスチャーゲーム</div>
      <div class="desc">でてきた おだいを、ことばをつかわずに からだでつたえよう！</div>
      <div class="arrow">あそぶ →</div>
    </a>

    <a class="game" href="stop-motion-game.html">
      <div class="icon">🎵🧊</div>
      <div class="title">ストップモーションゲーム</div>
      <div class="desc">おんがくが とまったら、そのばで ぴたっ！</div>
      <div class="arrow">あそぶ →</div>
    </a>
  </div>
</div>
</body>
</html>
