:1},{"w":5,"h":5,"edges":[[0,1],[0,5],[1,6],[2,3],[2,7],[2,8],[3,8],[4,9],[5,6],[5,10],[5,11],[7,8],[7,12],[7,13],[8,9],[8,13],[9,14],[10,11],[10,15],[11,12],[11,16],[13,14],[13,18],[14,19],[15,16],[15,20],[16,21],[17,22],[17,23],[18,23],[19,24],[21,22],[22,23],[23,24]],"start":13,"enemies":[2,17],"goal":5,"minimum":11,"good":1,"bad":3},{"w":5,"h":5,"edges":[[0,5],[1,2],[2,3],[2,8],[3,4],[3,8],[4,9],[5,6],[5,10],[6,7],[7,8],[8,9],[9,14],[10,11],[10,15],[11,16],[12,13],[12,17],[13,18],[14,19],[15,20],[16,17],[16,21],[17,18],[17,22],[18,19],[18,23],[19,24],[20,21],[21,22],[22,23],[23,24]],"start":4,"enemies":[9,19],"goal":14,"minimum":12,"good":1,"bad":1}],$=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
let unlocked=1;try{unlocked=Math.min(20,Math.max(1,Number(localStorage.getItem('oni20-v3-unlocked'))||1))}catch(_){}
let level=0,player=0,enemies=[],turns=0,locked=false,gameOver=false,adj=[],current=null,timers=[];
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id)}function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
function xy(id){const x=id%current.w,y=Math.floor(id/current.w);return{x:75+x*450/(current.w-1),y:145+y*545/(current.h-1)}}
function setPos(elem,id){const{x,y}=xy(id);elem.setAttribute('transform','translate('+x+' '+y+')')}
function draw(){const roads=$('roads'),nodes=$('nodes'),monsters=$('enemies');roads.replaceChildren();nodes.replaceChildren();monsters.replaceChildren();for(const[a,b]of current.edges){let p=xy(a),q=xy(b);el('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,class:'road'},roads);el('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,class:'road-inner'},roads)}for(let id=0;id<adj.length;id++){let p=xy(id),g=el('g',{class:'node',transform:'translate('+p.x+' '+p.y+')',role:'button',tabindex:'0','aria-label':'地点 '+(id+1)+' へ移動'},nodes);el('ellipse',{rx:44,ry:28,class:'node-ring'},g);el('ellipse',{rx:37,ry:22,class:'node-inner'},g);g.addEventListener('click',()=>move(id));g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();move(id)}})}enemies.forEach((id,k)=>{const g=el('g',{class:'char enemy',id:'enemy-'+k},monsters);el('circle',{r:29},g);const t=el('text',{},g);t.textContent='👹';setPos(g,id)});setPos($('player'),player);const p=xy(current.goal);$('goalIcon').setAttribute('transform','translate('+p.x+' '+(p.y-55)+')');highlight()}

function dist(target){const d=Array(adj.length).fill(Infinity),q=[target];d[target]=0;for(let i=0;i<q.length;i++)for(const v of adj[q[i]])if(d[v]===Infinity){d[v]=d[q[i]]+1;q.push(v)}return d}
function move(to){if(locked||gameOver||!adj[player].includes(to))return;locked=true;player=to;turns++;$('turns').textContent=turns;$('status').textContent='移動中…';setPos($('player'),to);highlight();if(enemies.includes(to)){later(()=>finish(false,'鬼のいる場所に飛び込んでしまった！'),250);return}if(to===current.goal){later(()=>finish(true,turns+'手でゴール！'),260);return}later(()=>{const d=dist(player);enemies=enemies.map((id,k)=>{const next=adj[id].reduce((best,v)=>d[v]<d[best]||d[v]===d[best]&&v<best?v:best,adj[id][0]);setPos($('enemy-'+k),next);return next});if(enemies.includes(player)){later(()=>finish(false,turns+'手目で追いつかれました。'),250);return}later(()=>{locked=false;$('status').textContent='あなたの番';highlight()},250)},280)}
function finish(win,message){gameOver=true;locked=true;highlight();$('status').textContent=win?'クリア！':'ゲームオーバー';if(win){unlocked=Math.max(unlocked,Math.min(20,level+2));try{localStorage.setItem('oni20-v3-unlocked',unlocked)}catch(_){}$('resultTitle').textContent=level===19?'🎉 全20面クリア！':'🎉 脱出成功！';$('resultText').textContent=level===19?'全20面を逃げ切りました！ '+message:message+' 次のステージへ進みます。';$('againBtn').textContent=level===19?'最初から遊ぶ':'次の面へ';$('overlay').classList.add('show');if(level<19)later(()=>load(level+1),1350)}else{$('resultTitle').textContent='👹 捕まった！';$('resultText').textContent=message;$('againBtn').textContent='もう一度';$('overlay').classList.add('show')}}
function load(i){clearTimers();level=i;current=stages[i];adj=Array.from({length:current.w*current.h},()=>[]);for(const[a,b]of current.edges){adj[a].push(b);adj[b].push(a)}adj.forEach(a=>a.sort((x,y)=>x-y));player=current.start;enemies=[...current.enemies];turns=0;locked=false;gameOver=false;$('turns').textContent='0';$('status').textContent='あなたの番';$('overlay').classList.remove('show');$('level').textContent='STAGE '+(i+1)+' / 20';$('progress').replaceChildren(...stages.map((_,j)=>{let s=document.createElement('i');s.className=j<i?'passed':j===i?'current':'';return s}));draw()}
$('resetBtn').onclick=()=>load(level);$('againBtn').onclick=()=>load(gameOver&&$('status').textContent==='クリア！'&&level<19?level+1:gameOver&&level===19&&$('status').textContent==='クリア！'?0:level);
