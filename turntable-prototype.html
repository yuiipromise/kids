<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>とうばんひょう プロトタイプ</title>
<style>
:root{
  --ink:#5d4a42;
  --you:#f7c9d8;
  --cat:#f7e6a7;
  --sister:#d9edb8;
  --chef:#cce8f6;
  --paper:#fffaf3;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100svh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#fffaf2,#fff4f6);
}
.wrap{width:min(430px,100%);margin:0 auto;padding:18px 12px 28px;text-align:center}
h1{font-size:24px;margin:4px 0 3px}
.sub{font-size:13px;opacity:.65;margin-bottom:12px}
.stage{
  position:relative;
  width:min(390px,96vw);
  aspect-ratio:1/1;
  margin:0 auto 8px;
}
.colorWheel{
  position:absolute;
  inset:8%;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    var(--sister) 0 25%,
    var(--chef) 25% 50%,
    var(--you) 50% 75%,
    var(--cat) 75% 100%
  );
  box-shadow:0 9px 24px #805f4b24,inset 0 0 0 6px #fff9;
  overflow:hidden;
}
.colorWheel::before,.colorWheel::after{
  content:"";
  position:absolute;
  background:#fff9;
  z-index:1;
}
.colorWheel::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
.colorWheel::after{top:50%;left:0;right:0;height:3px;transform:translateY(-50%)}

.dial{
  position:absolute;
  left:50%;top:50%;
  width:45%;aspect-ratio:1/1;
  margin:-22.5% 0 0 -22.5%;
  border-radius:50%;
  background:conic-gradient(from 0deg,#fff7e9 0 25%,#f6eadc 25% 50%,#fff7e9 50% 75%,#f6eadc 75% 100%);
  border:5px solid #fff;
  box-shadow:0 6px 18px #644a3b2f,inset 0 0 0 2px #d9c2ad;
  z-index:8;
}
.dial::before,.dial::after{
  content:"";position:absolute;background:#d9c6b7;opacity:.75;
}
.dial::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)}
.dial::after{top:50%;left:0;right:0;height:2px;transform:translateY(-50%)}
.hub{
  position:absolute;left:50%;top:50%;
  width:24px;height:24px;margin:-12px;
  border-radius:50%;background:#f4c5ad;border:4px solid #fff;
  box-shadow:0 2px 5px #75513f38;z-index:5;
}
.label{
  position:absolute;
  width:34px;height:70px;
  display:flex;align-items:center;justify-content:center;
  font-weight:1000;font-size:14px;
  line-height:1.05;border-radius:999px;
  background:#fffdf8;border:2px solid #e5d4c6;
  box-shadow:0 2px 6px #654a3b18;
  writing-mode:vertical-rl;
  text-orientation:upright;
  letter-spacing:-1px;
  transform-origin:center;
}
.l0{right:17%;top:9%;transform:rotate(45deg)}
.l1{right:17%;bottom:9%;transform:rotate(135deg)}
.l2{left:17%;bottom:9%;transform:rotate(225deg)}
.l3{left:17%;top:9%;transform:rotate(315deg)}
.label.rest{font-size:12px;color:#8f7568}

.char{
  position:absolute;
  z-index:12;
  width:34%;
  height:41%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
}
.char{--scale:1}
.char img{
  display:block;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  transform-origin:50% 86%;
  transform:scale(var(--scale));
  filter:drop-shadow(0 3px 4px #5f463522);
}
.cat{left:2%;top:0;--scale:.82}
.sister{right:1%;top:0;--scale:1.10}
.you{left:2%;bottom:0;--scale:1.04}
.chef{right:1%;bottom:0;--scale:.90}

.nameRow{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translate(-50%,55%);
  z-index:20;
  white-space:nowrap;
}
.char .name{
  min-width:70px;
  padding:5px 11px;
  border-radius:999px;
  font-size:13px;
  font-weight:1000;
  box-shadow:0 2px 7px #5f46351e;
}
.cat .name{background:var(--cat)}
.sister .name{background:var(--sister)}
.you .name{background:var(--you)}
.chef .name{background:var(--chef)}

.stage.spinning .char img{animation:sway 3.1s ease-in-out infinite alternate}
.stage.spinning .sister img{animation-duration:3.7s;animation-delay:-.8s}
.stage.spinning .you img{animation-duration:3.4s;animation-delay:-1.4s}
.stage.spinning .chef img{animation-duration:4s;animation-delay:-.4s}
@keyframes sway{
  0%{transform:translateY(1px) rotate(-2.2deg) scale(var(--scale))}
  50%{transform:translateY(-5px) rotate(.7deg) scale(var(--scale))}
  100%{transform:translateY(2px) rotate(2.1deg) scale(var(--scale))}
}

.resultTag{
  position:absolute;
  right:-18px;
  top:50%;
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:#fffdfb;
  border:3px solid #fff;
  box-shadow:0 3px 9px #5f46352c;
  font-size:13px;
  font-weight:1000;
  opacity:0;
  transform:translateY(-50%) scale(.7);
  transition:opacity .18s,transform .22s cubic-bezier(.2,1.4,.3,1);
}
.stage.done .resultTag{opacity:1;transform:translateY(-50%) scale(1)}
.char.resting img{filter:sepia(.82) saturate(.48) brightness(.96);opacity:.72}
.char.resting .name{filter:sepia(.75) saturate(.45);opacity:.72}
.restWash{
  position:absolute;inset:0;border-radius:50%;
  pointer-events:none;z-index:0;
}
.colorWheel.rest-0 .restWash{background:conic-gradient(from 0deg,rgba(150,113,74,.34) 0 25%,transparent 25% 100%)}
.colorWheel.rest-1 .restWash{background:conic-gradient(from 0deg,transparent 0 25%,rgba(150,113,74,.34) 25% 50%,transparent 50% 100%)}
.colorWheel.rest-2 .restWash{background:conic-gradient(from 0deg,transparent 0 50%,rgba(150,113,74,.34) 50% 75%,transparent 75% 100%)}
.colorWheel.rest-3 .restWash{background:conic-gradient(from 0deg,transparent 0 75%,rgba(150,113,74,.34) 75% 100%)}

.controls{display:flex;justify-content:center;gap:10px;margin-top:6px}
button{
  border:0;border-radius:999px;padding:12px 24px;
  font-size:17px;font-weight:1000;color:#76513d;
  background:linear-gradient(135deg,#ffd9a7,#ffc4d4);
  box-shadow:0 5px 13px #a66e5130;
  min-width:150px;
}
button:disabled{opacity:.5}
button.doneBtn{background:linear-gradient(135deg,#f3dcc4,#edd4d9);color:#8c776b;box-shadow:none;opacity:.72}
.note{font-size:12px;opacity:.62;margin-top:10px;line-height:1.5}
@media(max-width:360px){
  .stage{width:96vw}
  .char{width:35%;height:40%}
  .name{font-size:12px!important}
  .label{width:32px;height:64px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  .stage.spinning .char img{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>じゅんばんをきめよう！</h1>
  <div class="sub">とうばんひょうを まわして きめよう！</div>

  <div id="stage" class="stage">
    <div id="colorWheel" class="colorWheel"><div class="restWash"></div></div>

    <div class="char cat">
      <img src="assets/recipe/chars/cat/standing/char-cat-standing.png" alt="ねこさん">
      <div class="nameRow"><span class="name">ねこさん</span><span id="resCat" class="resultTag"></span></div>
    </div>
    <div class="char sister">
      <img src="assets/recipe/chars/sister/standing/char-sister-standing.png" alt="おねえさん">
      <div class="nameRow"><span class="name">おねえさん</span><span id="resSister" class="resultTag"></span></div>
    </div>
    <div class="char you">
      <img src="assets/recipe/chars/you/standing/char-you-standing.png" alt="あなた">
      <div class="nameRow"><span class="name">あなた</span><span id="resYou" class="resultTag"></span></div>
    </div>
    <div class="char chef">
      <img src="assets/recipe/chars/chef/standing/char-chef-standing.png" alt="シェフ">
      <div class="nameRow"><span class="name">シェフ</span><span id="resChef" class="resultTag"></span></div>
    </div>

    <div id="dial" class="dial" aria-label="とうばんひょう">
      <span id="label0" class="label l0">1ばん</span>
      <span id="label1" class="label l1">2ばん</span>
      <span id="label2" class="label l2">3ばん</span>
      <span id="label3" class="label l3 rest">おやすみ</span>
      <span class="hub"></span>
    </div>

  </div>

  <div class="controls">
    <button id="spinBtn" type="button">まわす！</button>
  </div>
  <div id="note" class="note">「あなた」は必ず参加。1ばん・2ばん・3ばん・おやすみの配置は毎回シャッフルします。</div>
</div>

<script>
const stage=document.getElementById("stage");
const dial=document.getElementById("dial");
const btn=document.getElementById("spinBtn");
const colorWheel=document.getElementById("colorWheel");
const labels=[0,1,2,3].map(i=>document.getElementById("label"+i));
const resultEls=[
  document.getElementById("resSister"),
  document.getElementById("resChef"),
  document.getElementById("resYou"),
  document.getElementById("resCat")
];
const charEls=[
  document.querySelector(".char.sister"),
  document.querySelector(".char.chef"),
  document.querySelector(".char.you"),
  document.querySelector(".char.cat")
];
// sector order clockwise: sister, chef, you, cat
const base=["1ばん","2ばん","3ばん","おやすみ"];
let labelsData=[...base];
let angle=0;
let raf=0;
let lastTime=0;
let spinning=false;
let stopping=false;
let stopAnim=null;
const spinSpeed=430;

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function rotateArray(a,steps){
  const n=((steps%a.length)+a.length)%a.length;
  return a.map((_,i)=>a[(i-n+a.length)%a.length]);
}
function renderLabels(arr){
  arr.forEach((v,i)=>{
    labels[i].textContent=v;
    labels[i].classList.toggle("rest",v==="おやすみ");
  });
}
function badgeText(v){
  if(v==="1ばん")return "1";
  if(v==="2ばん")return "2";
  if(v==="3ばん")return "3";
  return "休";
}
function clearResultState(){
  stage.classList.remove("done");
  colorWheel.classList.remove("rest-0","rest-1","rest-2","rest-3");
  charEls.forEach(el=>el.classList.remove("resting"));
  resultEls.forEach(el=>el.textContent="");
}
function showResults(finalBySector){
  finalBySector.forEach((v,i)=>{ resultEls[i].textContent=badgeText(v); });
  const restIndex=finalBySector.indexOf("おやすみ");
  if(restIndex>=0){
    colorWheel.classList.add("rest-"+restIndex);
    charEls[restIndex].classList.add("resting");
  }
}
function tick(t){
  if(!spinning)return;
  if(!lastTime)lastTime=t;
  const dt=Math.min((t-lastTime)/1000,.04);
  lastTime=t;
  angle+=spinSpeed*dt;
  dial.style.transform="rotate("+angle+"deg)";
  raf=requestAnimationFrame(tick);
}
function startSpin(){
  labelsData=shuffle(base);
  renderLabels(labelsData);
  clearResultState();
  stage.classList.add("spinning");
  btn.classList.remove("doneBtn");
  spinning=true;
  stopping=false;
  lastTime=0;
  btn.disabled=false;
  btn.textContent="とめる！";
  raf=requestAnimationFrame(tick);
}
function stopSpin(){
  if(!spinning||stopping)return;
  stopping=true;
  spinning=false;
  cancelAnimationFrame(raf);

  // Predict a natural coast, then choose a nearby valid quarter-turn.
  const desiredDecel=190;
  const naturalDistance=(spinSpeed*spinSpeed)/(2*desiredDecel);
  let target=Math.round((angle+naturalDistance)/90)*90;
  if(target<=angle+180)target+=90;

  while(true){
    const step=((Math.round(target/90)%4)+4)%4;
    if(rotateArray(labelsData,step)[2]!=="おやすみ")break;
    target+=90;
  }

  const startAngle=angle;
  const distance=target-startAngle;
  const decel=(spinSpeed*spinSpeed)/(2*distance);
  const duration=spinSpeed/decel;
  const startTime=performance.now();
  btn.disabled=true;
  btn.textContent="とまるよ…";

  function coast(now){
    const t=Math.min((now-startTime)/1000,duration);
    const moved=spinSpeed*t-.5*decel*t*t;
    angle=startAngle+moved;
    dial.style.transform="rotate("+angle+"deg)";
    if(t<duration){
      stopAnim=requestAnimationFrame(coast);
      return;
    }
    angle=target;
    dial.style.transform="rotate("+angle+"deg)";
    const step=((Math.round(angle/90)%4)+4)%4;
    const finalBySector=rotateArray(labelsData,step);
    showResults(finalBySector);
    stage.classList.remove("spinning");
    stage.classList.add("done");
    btn.textContent="きまり！";
    btn.classList.add("doneBtn");
    btn.disabled=true;
    stopping=false;
  }
  stopAnim=requestAnimationFrame(coast);
}
function spin(){
  if(stopping||btn.classList.contains("doneBtn"))return;
  if(spinning)stopSpin();
  else startSpin();
}
btn.addEventListener("click",spin);</script>
</body>
</html>
